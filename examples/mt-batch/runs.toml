# MtBatch: U mt_batch_transfer_calls [t1: 1, t2: 2] to an arbitrary receiver RX, which
# answers any vector of up to 3 entries with entries 0..3 (wrong lengths and amounts
# above the amount sent included), a malformed or empty result, or panics; RX starts
# with 1 of t1 and may spend 1 of t2 at any time, so the receiver-balance cap binds on
# t2. See MtBatch.tla.
#
#   python3 tools/run.py examples/mt-batch --anti-vacuity

spec = "MtBatch"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Conserved", "NoGain", "Honored", "Sane"]

[constants]
Accounts = "Accts"
StakingAcct = '"u"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
TokYocto = "0"
MtAccts = '{"mt"}'
MtIds = '{"t1", "t2"}'
MtHolders = "PMtHolders"
MtDev = "PMtDev"
MtCallReserve = "PMtReserve"
U = '"u"'
MT = '"mt"'
RX = '"rx"'
K = '"k"'
Tids = '<<"t1", "t2">>'
Amts = '<<1, 2>>'
U0 = "2"
RxStart = '[i \in {"t1", "t2"} |-> IF i = "t1" THEN 1 ELSE 0]'
RxVecs = 'MtAnswers(2, 0..3)'
RxResps = '{"mal", "empty", "panic"}'
SpendId = '"t2"'
SpendTo = '"k"'
MDev = "{}"
GasMenu = "{0}"

[[run]]
name = "mt_batch_std"
expect = "pass"
tags = ["tokens:nep245"]

# The cap at RX's balance binds: RX spent 1 of t2 before the resolver ran, so U does
# not get back every token RX reported unused. (Honored, which caps, holds: mt_batch_std.)
[[run]]
name = "mt_batch_cap_binds"
expect = "violation"
invariant = "AllUnusedBack"
invariants = ["AllUnusedBack"]
tags = ["tokens:nep245"]

# A resolver that ignores the receiver's per-id answer and refunds nothing.
[[run]]
name = "mt_batch_ignores_result"
expect = "violation"
invariant = "Honored"
invariants = ["Honored"]
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
MDev = '{"resolveIgnoresResult"}'

# A resolver that does not cap the unused amount at the amount sent: RX over-reports
# unused on t1 (it holds 2 of it once the transfer lands) and U ends with more t1 than
# it started with.
[[run]]
name = "mt_batch_nocap"
expect = "violation"
invariant = "NoGain"
invariants = ["NoGain"]
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
MDev = '{"resolveNoCap"}'

# Gas mode on the measured near-sdk-contract-tools table (modules/CalibStdMt.tla) with
# MtGasShape "tools": at 29.9 Tgas the call fails at the 30 Tgas floor and nothing moves;
# at 30 Tgas it gets through, the receiver and the resolver run, and every property holds
# (FloorHolds: the resolver runs iff U attached at least 30 Tgas). A smaller answer set
# keeps it quick.
[[run]]
name = "mt_batch_gas_std"
expect = "pass"
invariants = ["Conserved", "NoGain", "Honored", "Sane", "FloorHolds"]
tags = ["tokens:nep245", "gas:calibrated"]
[run.constants]
GasMode = '"gas"'
GasCall = "PStdGasCall"
GasBurn = "PStdGasBurn"
MtGasShape = "PMtShape"
GasMenu = "{29900, 30000}"
RxVecs = '{<<0, 0>>, <<1, 2>>, <<3, 0>>, <<0>>}'

# The same gas-mode run with t1 an id class of 3 ids (Nep245's MtIdCount), so the batch
# carries 4 ids: more than the table was measured on (MtGasIds, 3), and the resolver's burn
# grows faster than linearly past it (docs/SEMANTICS.md T5). An Assert, not a burn.
[[run]]
name = "mt_batch_gas_class"
expect = "assert"
expect_output = "MtGasIds"
tags = ["tokens:nep245", "gas:calibrated"]
[run.constants]
GasMode = '"gas"'
GasCall = "PStdGasCall"
GasBurn = "PStdGasBurn"
MtGasShape = "PMtShape"
GasMenu = "{30000}"
RxVecs = '{<<0, 0>>}'
MtIdCount = '[i \in {"t1"} |-> 3]'

# The same gas-mode run with t1 standing for a 16-byte id (MtIdLen): longer than the ids
# the table was measured on (MtGasIdLen, 2), and the burn grows with the ids' length.
[[run]]
name = "mt_batch_gas_long_id"
expect = "assert"
expect_output = "MtGasIdLen"
tags = ["tokens:nep245", "gas:calibrated"]
[run.constants]
GasMode = '"gas"'
GasCall = "PStdGasCall"
GasBurn = "PStdGasBurn"
MtGasShape = "PMtShape"
GasMenu = "{30000}"
RxVecs = '{<<0, 0>>}'
MtIdLen = '[i \in {"t1"} |-> 16]'

# And an empty batch: no ids is outside the measured 1-3 as well.
[[run]]
name = "mt_batch_gas_empty"
expect = "assert"
expect_output = "outside 1..MtGasIds"
tags = ["tokens:nep245", "gas:calibrated"]
[run.constants]
GasMode = '"gas"'
GasCall = "PStdGasCall"
GasBurn = "PStdGasBurn"
MtGasShape = "PMtShape"
GasMenu = "{30000}"
Tids = "<<>>"
Amts = "<<>>"
RxVecs = '{<<>>}'

# An id class of 0 ids is a modeling error: an Assert.
[[run]]
name = "mt_batch_class_zero"
expect = "assert"
expect_output = "MtIdCount"
tags = ["tokens:nep245"]
[run.constants]
MtIdCount = '[i \in {"t1"} |-> 0]'

# Amounts of 64 and more: the receiver's and the resolver's vectors encode entries up to
# 1023 for two ids (MtVecCode); RX holds 100 of t1 to start, so the cap binds on t2 only.
[[run]]
name = "mt_batch_big"
expect = "pass"
tags = ["tokens:nep245"]
[run.constants]
Amts = '<<100, 20>>'
U0 = "100"
RxStart = '[i \in {"t1", "t2"} |-> IF i = "t1" THEN 100 ELSE 0]'
RxVecs = '{<<100, 20>>, <<0, 0>>, <<70, 25>>, <<0, 300>>, <<100>>, <<1, 2, 3>>}'

# near-sdk-contract-tools 4.0.0's zero amounts: the t1 entry of 0 moves nothing and the
# call goes through (with the default MtDev it panics, and nothing moves either).
[[run]]
name = "mt_batch_zero_skipped"
expect = "pass"
tags = ["tokens:nep245"]
[run.constants]
Amts = '<<0, 2>>'
MDev = '{"zeroAmountSkipped"}'

# near-sdk-contract-tools 4.0.0's transfer to oneself: RX's mt_transfer to RX adds the
# amount to RX's balance, so the id's supply grows. With the default MtDev it is refused.
[[run]]
name = "mt_batch_self_credits"
expect = "violation"
invariant = "Conserved"
invariants = ["Conserved"]
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
SpendTo = '"rx"'
MDev = '{"selfTransferCredits"}'

[[run]]
name = "mt_batch_self_refused"
expect = "pass"
tags = ["tokens:nep245"]
[run.constants]
SpendTo = '"rx"'

# The batch resolver called directly with token_ids and amounts of unequal lengths, and
# vector codes with large entries: fixed cases in the initial state (MtResolverCases.tla).
[[run]]
name = "mt_resolver_cases"
expect = "pass"
spec = "MtResolverCases"
next = "Stay"
invariants = ["ResolverCases", "VecCodes"]
tags = ["tokens:nep245"]
[run.constants]
RxStart = '[i \in {"t1", "t2"} |-> IF i = "t1" THEN 10 ELSE 0]'

# A repeated id refunded to oneself (near-sdk-contract-tools' self-transfer): the caps
# come from the balance before any refund, so the second entry's cap is 0.
[[run]]
name = "mt_resolver_cases_self"
expect = "pass"
spec = "MtResolverCases"
next = "Stay"
invariants = ["SelfCases"]
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
MDev = '{"selfTransferCredits"}'

# A zero transfer to oneself with zero amounts skipped: no panic.
[[run]]
name = "mt_zero_self"
expect = "pass"
spec = "MtResolverCases"
next = "Stay"
invariants = ["ZeroSelf"]
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
MDev = '{"zeroAmountSkipped"}'

# A vector of 16 entries: the code's length field holds 15 at most, so MtVecCode stops
# TLC instead of returning a code another vector also has.
[[run]]
name = "mt_vec_code_long"
expect = "assert"
expect_output = 'MtVecCode: 16 entries or more'
spec = "MtResolverCases"
next = "Stay"
invariants = ["VecCodeLong"]
tags = ["tokens:nep245"]

# ---- anti-vacuity: python3 tools/run.py examples/mt-batch --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.

# Honored's antecedent: the transfer settles.
[[witness]]
id = "transfer_settles"
expr = '~Settled'
runs = ["mt_batch_std"]

# The resolver's arms: Failed, a vector of the wrong length, not a vector, an entry
# above its amount.
[[witness]]
id = "resolver_sees_failed"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ ~r.res.ok)'
runs = ["mt_batch_std"]

[[witness]]
id = "resolver_sees_wrong_length"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ MtVecOf(r.res).ok /\ Len(MtVecOf(r.res).v) # 2)'
runs = ["mt_batch_std"]

[[witness]]
id = "resolver_sees_not_a_vector"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ r.res.ok /\ ~MtVecOf(r.res).ok)'
runs = ["mt_batch_std"]

[[witness]]
id = "resolver_sees_over_amount"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ MtVecOf(r.res).ok /\ Len(MtVecOf(r.res).v) = 2 /\ \E j \in 1..2 : MtVecOf(r.res).v[j] > Amts[j])'
runs = ["mt_batch_std"]

# Per id: t1 kept by RX while t2 comes back in full.
[[witness]]
id = "one_id_kept_one_refunded"
expr = '~(Settled /\ mtk[MT].bal[U]["t1"] = U0 - 1 /\ mtk[MT].bal[U]["t2"] = U0)'
runs = ["mt_batch_std"]

# The receiver-balance cap: RX short of an amount when the resolver runs, and the cap
# binding on a settled transfer.
[[witness]]
id = "receiver_short_at_resolve"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ \E j \in 1..2 : mtk[MT].bal[RX][Tids[j]] < Amts[j])'
runs = ["mt_batch_std"]

[[witness]]
id = "cap_binds_settled"
expr = '~(Settled /\ \E j \in 1..2 : gRxAt[Tids[j]] < gUnused[j])'
runs = ["mt_batch_std"]

# Large amounts: a refund of an entry above 63 reaches U.
[[witness]]
id = "big_refund_settles"
expr = '~(Settled /\ ~NoResolve /\ mtk[MT].bal[U]["t1"] > U0 - 100 + 63)'
runs = ["mt_batch_big"]

# Zero amounts skipped: the call with a 0 entry reaches the resolver.
[[witness]]
id = "zero_entry_resolves"
expr = '~(Settled /\ ~NoResolve)'
runs = ["mt_batch_zero_skipped"]

# Gas mode: the floor refuses 29.9 Tgas, and a call at 30 Tgas reaches the resolver.
[[witness]]
id = "gas_floor_refuses"
expr = '~(Settled /\ NoResolve)'
runs = ["mt_batch_gas_std"]

[[witness]]
id = "gas_call_resolves"
expr = '~(Settled /\ ~NoResolve)'
runs = ["mt_batch_gas_std"]

[[mutant]]
id = "resolver_dropped"
file = "Nep245.tla"
library = true
find = '!.ps = @ \cup {res}'
replace = '!.ps = @'
class = "dropped .then"

# Every id read from the first entry of the answer.
[[mutant]]
id = "per_id_reads_first_entry"
file = "Nep245.tla"
library = true
find = 'IF vec.ok /\ Len(vec.v) = m THEN [r.res EXCEPT !.v = vec.v[i]]'
replace = 'IF vec.ok /\ Len(vec.v) = m THEN [r.res EXCEPT !.v = vec.v[1]]'
class = "inverted result check"

# A longer answer read as if it had the right length.
[[mutant]]
id = "wrong_length_accepted"
file = "Nep245.tla"
library = true
find = 'IF vec.ok /\ Len(vec.v) = m THEN'
replace = 'IF vec.ok /\ Len(vec.v) >= m THEN'
class = "removed precondition"

# A Failed or malformed answer counted as all used.
[[mutant]]
id = "failed_counts_as_used"
file = "Nep245.tla"
library = true
find = 'ELSE [r.res EXCEPT !.ok = FALSE]'
replace = 'ELSE [ok |-> TRUE, v |-> 0, sz |-> 0, len |-> 0]'
class = "failure branch skips rollback"

[[mutant]]
id = "cap_off_by_one"
file = "TokenCommon.tla"
library = true
find = 'ELSE TMin(NumOrChecked(res, max, amt), amt)'
replace = 'ELSE TMin(NumOrChecked(res, max, amt), amt - 1)'
class = "off-by-one guard"

[[mutant]]
id = "no_balance_cap"
file = "TokenCommon.tla"
library = true
find = 'IF u > 0 /\ rcvBal > 0 THEN TMin(rcvBal, u) ELSE 0'
replace = 'IF u > 0 THEN u ELSE 0'
class = "removed precondition"

# The batch refund stays with the receiver.
[[mutant]]
id = "refund_stays_with_receiver"
file = "Nep245.tla"
library = true
find = 'IN [L |-> MtMove(L, a.rc, a.s, id, refund, MtDev[r.to]),'
replace = 'IN [L |-> L,'
class = "wrong refund account"

# The 30 Tgas floor checked 100 Ggas low: a 29.9 Tgas call gets through.
[[mutant]]
id = "gas_floor_low"
file = "Nep245.tla"
library = true
find = 'LastGas(r) < MtMinCallGas[r.to]'
replace = 'LastGas(r) < MtMinCallGas[r.to] - 100'
class = "off-by-one guard"
runs = ["mt_batch_gas_std"]

# The vector code at a fixed 6 bits per entry (the earlier base 64): an entry of 100
# decodes wrong.
[[mutant]]
id = "vec_code_fixed_bits"
file = "Nep245.tla"
library = true
find = 'LET k == MtVecBits(MtVecMax(s), 1) IN'
replace = 'LET k == 6 IN'
class = "wrong argument"
runs = ["mt_batch_big"]

# The answer's length compared with token_ids' instead of amounts'.
[[mutant]]
id = "length_vs_token_ids"
file = "Nep245.tla"
library = true
find = 'IF vec.ok /\ Len(vec.v) = m THEN'
replace = 'IF vec.ok /\ Len(vec.v) = Len(a.tids) THEN'
class = "wrong argument"
runs = ["mt_resolver_cases"]

# A later entry's cap read from the ledger after earlier refunds (a self refund raises it).
[[mutant]]
id = "cap_after_moves"
file = "Nep245.tla"
library = true
find = 'cap |-> [c EXCEPT ![id] = @ - refund],'
replace = 'cap |-> [c EXCEPT ![id] = MtMove(L, a.rc, a.s, id, refund, MtDev[r.to]).bal[a.rc][id]],'
class = "lost update"
runs = ["mt_resolver_cases_self"]

# The zero skip checked after the sender = receiver refusal.
[[mutant]]
id = "zero_skip_after_self_check"
file = "Nep245.tla"
library = true
find = 'ELSE IF amt = 0 /\ "zeroAmountSkipped" \in dev THEN acc'
replace = 'ELSE IF amt = 0 /\ "zeroAmountSkipped" \in dev /\ s # rc THEN acc'
class = "removed precondition"
runs = ["mt_zero_self"]

# ---- audit (docs/RUNNER.md, "Auditing what the runs reach") ----

# The model's methods: the calls users and other contracts make, and the callbacks.
[audit]
methods = ["mt_on_transfer"]
