# Library self-test: deterministic scenarios with known nearcore outcomes. See SelfTest.tla.
# Each run explores the scenarios in Scns (one per initial state); Check compares the end
# state of each with Expect, Sane checks conservation, orphans, token supply and gas bounds.
#
#   python3 tools/run.py examples/platform-selftest

spec = "SelfTest"
workers = 2
library = "../../modules"
budget_s = 120
invariants = ["Check", "Sane"]
deadlock = true
tags = ["selftest"]

[constants]
Accounts = "Accts"
StakingAcct = '"v"'
MinStake = "2"
StorageFloor = "SFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "1"          # epoch ticks happen only where a script has Tick
MaxReward = "0"
Exists = "SExists"
Contracts = "SCode"
AcctKind = "SKinds"
GasMode = '"fault"'
GasCall = "NoTable"
GasBurn = "NoTable"
LogOn = "FALSE"
TokYocto = "1"
TokenAccts = '{"ft"}'
WNearAccts = '{"ft"}'
TokHolders = "STokHolders"
TokStorageMin = "STokMin"
TokDev = "STokDev"
TokCallReserve = "STokReserve"
KeyAccts = "SKeyAccts"
AcctParent = "SParents"
TopCreator = '"w"'

# Receipts, results, accounts, refunds, staking, storage.
[[run]]
name = "selftest_platform"
expect = "pass"
[run.constants]
Scns = '''{"revert_children", "waiter_failed", "cb_chain", "refund_to", "named_not_created",
          "implicit_created", "universal", "refund_burnt", "no_code", "nopr_vs_zero", "transfer_empty",
          "result_size", "stake_ok", "stake_actor", "stake_signer", "stake_fails", "stake_restake",
          "floor_locked", "liquid_negative"}'''

# Access keys: AddKey / DeleteKey rules and what a function-call key may sign.
[[run]]
name = "selftest_keys"
expect = "pass"
[run.constants]
Scns = '{"addkey_present", "delkey_absent", "keys_bundled", "key_other_acct", "fc_keys"}'

# Token standards (near-contract-standards 5.29.1 defaults).
[[run]]
name = "selftest_tokens"
expect = "pass"
[run.constants]
Scns = '''{"ft_rules", "storage", "wnear", "batch", "views", "resolve_private",
          "unregister_force", "resolver_burn"}'''

# Gas: zero-gas children, panic vs out of gas, per-action leftover and panics, FT 5.x gas shape.
[[run]]
name = "selftest_gas"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '''{"zero_gas_child", "zero_gas_cb", "zero_gas_share", "zero_gas_left0", "zero_gas_heavy",
          "zero_gas_split", "panic_oog", "panic_plain", "oog_and_broke", "per_action",
          "per_action_two", "per_action_panic", "ft_std_gas"}'''

# A weighted call whose share floors to 0 Ggas under "nearest" fails its creator; under
# "up" (selftest_gas) zero_gas_share's calls certainly get a share (1 Ggas over weights 1 + 1),
# so the creator commits and the calls run out of gas, while zero_gas_left0, zero_gas_heavy
# and zero_gas_split's first transaction may get 0 gas in nearcore or not, and keep both.
[[run]]
name = "selftest_gas_share_nearest"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"zero_gas_share", "zero_gas_left0", "zero_gas_heavy", "zero_gas_split"}'
"NearFees!FeeRounding" = '"nearest"'

# Under "up" a static-0 weighted call whose share may be 0 gas in nearcore keeps both
# outcomes of its creator.  A model leftover of 0 (nearcore's may be larger): the creator
# can commit (it always failed before) ...
[[run]]
name = "selftest_zero_left0_commits"
expect = "violation"
invariant = "CreatorNeverCommits"
invariants = ["CreatorNeverCommits"]
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"zero_gas_left0"}'

# ... and can fail.
[[run]]
name = "selftest_zero_left0_fails"
expect = "violation"
invariant = "CreatorAlwaysCommits"
invariants = ["CreatorAlwaysCommits"]
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"zero_gas_left0"}'

# Weights 1 and 10^9 sharing 1 Ggas (nearcore: [0, 10^9] gas units when it is exactly 1
# Ggas): the creator can fail (it always committed before) ...
[[run]]
name = "selftest_zero_heavy_fails"
expect = "violation"
invariant = "CreatorAlwaysCommits"
invariants = ["CreatorAlwaysCommits"]
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"zero_gas_heavy"}'

# ... and can commit.
[[run]]
name = "selftest_zero_heavy_commits"
expect = "violation"
invariant = "CreatorNeverCommits"
invariants = ["CreatorNeverCommits"]
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"zero_gas_heavy"}'

# FT 3.x gas shape (TokFtGasShape "reserve").
[[run]]
name = "selftest_gas_reserve"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCallRes"
GasBurn = "SGasBurn"
TokFtGasShape = "ReserveShapes"
Scns = '{"ft_reserve_gas"}'

# The same without a GasCall entry for the resolver: TokResolveStatic, weight 0.
[[run]]
name = "selftest_gas_reserve_nocall"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
TokFtGasShape = "ReserveShapes"
Scns = '{"ft_reserve_gas"}'

# Token batch accounted per action (TokBatchPerAction, the default): near_deposit and
# ft_transfer_call each have their own gas and "ft.batch/DC#<method>" burn key; only
# ft_transfer_call's leftover reaches ft_on_transfer.
[[run]]
name = "selftest_gas_batch"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"batch_per_action"}'

# TokBatchPerAction <- FALSE (the earlier default): one pool, the whole-batch key "ft.batch/DC".
[[run]]
name = "selftest_gas_batch_pooled"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
TokBatchPerAction = "FALSE"
PooledGasOK = "TRUE"
Scns = '{"batch_pooled"}'

# Path-specific burn keys: storage_deposit/new, near_deposit/registered,
# ft_resolve_transfer/refund; the other paths fall back to the method key.
[[run]]
name = "selftest_gas_paths"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasPath"
Scns = '{"path_keys"}'

# Misuse is an Assert, not a wrong verdict: a multi-call receipt without pa (PoolCheck),
# pa with fewer records than gas entries (PAOK), a call child without static gas (GasListsOK).
[[run]]
name = "selftest_assert_pool"
expect = "assert"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"assert_pool"}'

[[run]]
name = "selftest_assert_pa_len"
expect = "assert"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"assert_pa_len"}'

[[run]]
name = "selftest_assert_empty_gs"
expect = "assert"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"assert_empty_gs"}'

# v0.2: joint callbacks, yield/resume and the block clock.  A yield times out only after a
# scripted block ("btick": MaxBlk 2, YieldTicks 1), so the scenarios are deterministic where
# nearcore is.
[[run]]
name = "selftest_async"
expect = "pass"
[run.constants]
MaxBlk = "2"
YieldTicks = "1"
Scns = '''{"and_order", "resume_twice", "resume_same_call", "timeout_then_resume",
          "resume_beats_timeout", "resume_other_acct", "yield_returned", "yield_id_recreate",
          "yield_id_recreate_timeout", "yield_id_same_call"}'''

# The same in gas mode, plus gas-only scenarios: a joint or yield callback with 0 gas fails
# its creator; a starved input is Failed at its position only.
[[run]]
name = "selftest_async_gas"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
MaxBlk = "2"
YieldTicks = "1"
Scns = '''{"and_order", "and_zero_cb", "and_starved_leg", "resume_twice", "resume_same_call",
          "timeout_then_resume", "resume_beats_timeout", "resume_other_acct", "yield_returned",
          "yield_zero_cb"}'''

# Mutants: the duplicate check of promise_yield_create_with_id through the state view
# PendingYields(r.to) (OldDupCheck) is wrong inside a handler.  It still lists the running
# callback, so the callback cannot re-create its own custom id ...
[[run]]
name = "selftest_yield_id_old_recreate"
expect = "violation"
invariant = "Check"
[run.constants]
MaxBlk = "2"
YieldTicks = "1"
OldDupCheck = "TRUE"
Scns = '{"yield_id_recreate"}'

# ... and it misses a yield created earlier in the same call, so a duplicate is created.
[[run]]
name = "selftest_yield_id_old_same_call"
expect = "violation"
invariant = "Check"
[run.constants]
MaxBlk = "2"
YieldTicks = "1"
OldDupCheck = "TRUE"
Scns = '{"yield_id_same_call"}'

# Delegate actions (NEP-366): who the inner call sees, the nonce and expiry checks, the two
# deposit refund paths, function-call keys on either side.  MaxBlk 2 lets "deleg_expired"
# script a block; the other scenarios have no expiry, so every one is deterministic.
[[run]]
name = "selftest_deleg"
expect = "pass"
[run.constants]
MaxBlk = "2"
Scns = '''{"deleg_ok", "deleg_replay", "deleg_expired", "deleg_inner_fail", "deleg_fc_key",
          "deleg_fc_relayer", "deleg_checks"}'''

# The same in gas mode: the inner call gets the delegate's gas (10 Tgas), its child a share.
[[run]]
name = "selftest_deleg_gas"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
MaxBlk = "2"
Scns = '{"deleg_ok", "deleg_replay", "deleg_expired", "deleg_inner_fail"}'

# Per-byte storage (StoragePerByte): growth within the balance, beyond it (the receipt fails
# and reverts, a callback sees Failed), shrinking, the 770-byte zero-balance allowance,
# locked balance, key bytes, implicit-account bytes, the signer check at submission, and
# token registrations.
[[run]]
name = "selftest_storage"
expect = "pass"
[run.constants]
StoragePerByte = "TRUE"
StorageInit = "SStor"
StorageByteCost = "SCost"
TokRegBytes = "STokBytes"
Scns = '''{"stor_grow", "stor_revert", "stor_shrink", "stor_zero_balance", "stor_locked",
          "stor_keys", "stor_implicit", "stor_signer", "stor_tokens"}'''

# Account lifecycle: CreateAccount (parent, TopCreator, implicit ids, atomic batches with
# keys), DeleteAccount (actor, beneficiary present / absent / self, staking), receipts to a
# deleted account, creating it again (NEAR-implicit by a Transfer, with its key), and a
# yield that outlives its account (D4).  MaxBlk 2 so that no yield times out unscripted.
[[run]]
name = "selftest_lifecycle"
expect = "pass"
[run.constants]
MaxBlk = "2"
YieldTicks = "1"
Scns = '''{"acct_create", "acct_keys", "acct_not_parent", "acct_implicit", "acct_top",
          "del_beneficiary", "del_absent", "del_self", "del_staking", "del_receipts", "recreate",
          "implicit_recreate", "stale_cb_recreate"}'''

# The same in gas mode, with the creator-side fees of account receipts (acct_fee).
[[run]]
name = "selftest_lifecycle_gas"
expect = "pass"
[run.constants]
GasMode = '"gas"'
GasCall = "SGasCall"
GasBurn = "SGasBurn"
Scns = '{"acct_fee", "acct_keys", "acct_top", "del_beneficiary", "del_absent", "recreate"}'

# Per-byte storage: a new account's bytes, freed by its deletion, and the 10,000-byte delete
# limit with the code subtracted (CodeSize).
[[run]]
name = "selftest_lifecycle_storage"
expect = "pass"
[run.constants]
StoragePerByte = "TRUE"
StorageInit = "LStor"
StorageByteCost = "LCost"
CodeSize = "LCode"
Scns = '{"del_large", "acct_bytes", "acct_bytes_del"}'

# Without universal accounts (UniversalOn = FALSE, protocol < 87) a 0u id is named: w creates
# it with [CreateAccount, Transfer, AddKey], then its key action, delegate and delete succeed.
[[run]]
name = "selftest_universal_off"
expect = "pass"
[run.constants]
UniversalOn = "FALSE"
Scns = '{"universal_off"}'

# Call receipts with account actions (A8): a factory batch whose init finds no code, a call
# followed by its account's DeleteAccount, and one on another account (ActorNoPermission).
[[run]]
name = "selftest_accall"
expect = "pass"
[run.constants]
Scns = '{"accall_nocode", "accall_delete", "accall_actor"}'

# CallsNeedCode = FALSE (the new account's code is assumed): the batch commits; checks first.
[[run]]
name = "selftest_accall_code_off"
expect = "pass"
[run.constants]
CallsNeedCode = "FALSE"
Scns = '{"accall_init", "accall_exists", "accall_recreate", "accall_not_parent", "accall_create_del"}'

# A call that returns a promise, then DeleteAccount: the child runs, the callback gets the
# delete's empty bytes (the child wired to the callback is not forwarded).
[[run]]
name = "selftest_accall_prom"
expect = "pass"
[run.constants]
Scns = '{"accall_prom"}'

# CallsNeedCode = FALSE switches off the code check only: a missing or uninitialised receiver
# still fails the call.
[[run]]
name = "selftest_code_off_missing"
expect = "pass"
[run.constants]
CallsNeedCode = "FALSE"
Scns = '{"code_off_missing"}'

# Per-byte storage: the new account's bytes, an unaffordable batch, the skip on delete.
[[run]]
name = "selftest_accall_storage"
expect = "pass"
[run.constants]
CallsNeedCode = "FALSE"
StoragePerByte = "TRUE"
StorageInit = "LStor"
StorageByteCost = "LCost"
CodeSize = "LCode"
Scns = '{"accall_bytes", "accall_lackstate", "accall_del_stor"}'

# Instant receipts: a contract's self-delete runs before the call it made alongside (so a
# call back to it fails), a delegate's inner delete (relayed by another account, and by the
# user itself: a local creator), a transaction's own delete (not instant).
[[run]]
name = "selftest_instant"
expect = "pass"
[run.constants]
Scns = '''{"instant_close", "instant_payout", "instant_deleg", "instant_deleg_local",
          "instant_tx"}'''

# InstantFirst <- FALSE: c's delete may come after c.probe, so instant_close's Expect fails.
[[run]]
name = "selftest_instant_off"
expect = "violation"
invariant = "Check"
[run.constants]
InstantFirst = "FALSE"
Scns = '{"instant_close"}'

# The payout is not instant: d.seebal can run before it ...
[[run]]
name = "selftest_payout_before"
expect = "violation"
invariant = "PayoutBeforeSeen"
invariants = ["PayoutBeforeSeen"]
[run.constants]
Scns = '{"instant_payout"}'

# ... and after it.
[[run]]
name = "selftest_payout_after"
expect = "violation"
invariant = "PayoutAfterSeen"
invariants = ["PayoutAfterSeen"]
[run.constants]
Scns = '{"instant_payout"}'

# ---- anti-vacuity: python3 tools/run.py examples/platform-selftest --anti-vacuity ----

# The library: a child wired to the callback of a [call, DeleteAccount] receipt is still
# forwarded, so the callback gets a second result.
[[mutant]]
id = "lib_delete_forwards_promise"
file = "NearAsync.tla"
library = true
find = 'Unfwd(c) == IF b # "" /\ r.cb # 0 /\ c.cb = r.cb THEN [c EXCEPT !.cb = 0] ELSE c'
replace = 'Unfwd(c) == c'
class = "platform rule dropped (library)"
killed_by = ["Sane", "Check", "deadlock"]
runs = ["selftest_accall_prom"]

# The library: the factory batch's Transfer is also the call's attached deposit.
[[mutant]]
id = "lib_create_deposit_to_call"
file = "NearAsync.tla"
library = true
find = "xfer |-> r.dep]]\n         @@ [r EXCEPT !.dep = 0,"
replace = "xfer |-> 0]]\n         @@ [r EXCEPT !.dep = @,"
class = "wrong effect (library)"
killed_by = ["Check"]
runs = ["selftest_accall_code_off"]

# The library: CallsNeedCode = FALSE lets calls reach accounts that do not exist.
[[mutant]]
id = "lib_code_off_any_receiver"
file = "NearAsync.tla"
library = true
find = "ELSE AcctExists(r.to) /\\ ~UninitUniversal(r.to) /\\ (~CallsNeedCode \\/ HasCode(r.to))"
replace = "ELSE r.to \\notin deleted /\\ (~CallsNeedCode \\/ HasCode(r.to))"
class = "platform rule dropped (library)"
killed_by = ["Check"]
runs = ["selftest_code_off_missing"]
