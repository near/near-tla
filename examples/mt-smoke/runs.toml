# MtSmoke: U mt_transfer_calls 1 of "t1" to an arbitrary receiver RX (which already
# holds 1); the resolver refunds what RX asks back, capped at the amount (standard)
# or not ("resolveNoCap"). See MtSmoke.tla.
#
#   python3 tools/run.py examples/mt-smoke

spec = "MtSmoke"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Conserved", "Honored", "Sane"]

[constants]
Accounts = "Accts"
StakingAcct = '"u"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
TokYocto = "0"
MtAccts = '{"mt"}'
MtIds = '{"t1"}'
MtHolders = "PMtHolders"
MtDev = "PMtDev"
MtCallReserve = "PMtReserve"
U = '"u"'
MT = '"mt"'
RX = '"rx"'
RxResps = '{"keep", "return", "over", "mal", "empty", "panic"}'
MDev = "{}"

[[run]]
name = "mt_std"
expect = "pass"
tags = ["tokens:nep245"]

# Uncapped resolver: RX answers amt + 1 and U gets back more than it sent.
[[run]]
name = "mt_nocap"
expect = "violation"
invariant = "Honored"
tags = ["tokens:nep245", "tokens:deviation"]
[run.constants]
MDev = '{"resolveNoCap"}'

# ---- anti-vacuity: python3 tools/run.py examples/mt-smoke --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.

# Honored's antecedent: the transfer settles.
[[witness]]
id = "transfer_settles"
expr = '~(ntx = 1 /\ TxSettled(1))'
runs = ["mt_std"]

# The resolver's arms: RX's answer Failed, above the amount, unparsable.
[[witness]]
id = "resolver_sees_failed"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ ~r.res.ok)'
runs = ["mt_std"]

[[witness]]
id = "resolver_sees_over_amount"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ IsNum(r.res) /\ r.res.v > r.a.amt)'
runs = ["mt_std"]

[[witness]]
id = "resolver_sees_unparsable"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ r.res.ok /\ ~IsNum(r.res))'
runs = ["mt_std"]

# The receiver-balance cap never binds: RX holds 2 once it received 1, and asks back at most 1.
[[witness]]
id = "receiver_short_at_resolve"
expr = '~(\E r \in Runnable : r.m = "mt_resolve_transfer" /\ mtk[MT].bal[RX]["t1"] < r.a.amt)'
runs = ["mt_std"]
expect = "unreachable"
reason = "RX starts with 1 and never spends; examples/nep141-refund-cap covers the cap"

[[mutant]]
id = "resolver_dropped"
file = "Nep245.tla"
library = true
find = '!.ps = @ \cup {res}'
replace = '!.ps = @'
class = "dropped .then"

[[mutant]]
id = "failed_counts_as_used"
file = "TokenCommon.tla"
library = true
find = 'ELSE TMin(NumOrChecked(res, max, amt), amt)'
replace = 'ELSE IF ~res.ok THEN 0 ELSE TMin(NumOrChecked(res, max, amt), amt)'
class = "failure branch skips rollback"

[[mutant]]
id = "unparsable_counts_as_used"
file = "TokenCommon.tla"
library = true
find = 'ELSE TMin(NumOrChecked(res, max, amt), amt)'
replace = 'ELSE TMin(NumOrChecked(res, max, 0), amt)'
class = "inverted result check"

[[mutant]]
id = "cap_off_by_one"
file = "TokenCommon.tla"
library = true
find = 'ELSE TMin(NumOrChecked(res, max, amt), amt)'
replace = 'ELSE TMin(NumOrChecked(res, max, amt), amt - 1)'
class = "off-by-one guard"

[[mutant]]
id = "no_balance_cap"
file = "TokenCommon.tla"
library = true
find = 'IF u > 0 /\ rcvBal > 0 THEN TMin(rcvBal, u) ELSE 0'
replace = 'IF u > 0 THEN u ELSE 0'
class = "removed precondition"
equivalent = "the cap never binds here (witness receiver_short_at_resolve never reached)"

# The refund stays with the receiver instead of going back to the sender.
[[mutant]]
id = "refund_stays_with_receiver"
file = "Nep245.tla"
library = true
find = 'L1 == MtMove(L, a.rc, a.s, a.tid, refund, MtDev[r.to])'
replace = 'L1 == L'
class = "wrong refund account"

# ---- audit (docs/USAGE.md, "Auditing what the runs reach") ----

# The model's methods: the calls users and other contracts make, and the callbacks.
[audit]
methods = ["mt_on_transfer"]
