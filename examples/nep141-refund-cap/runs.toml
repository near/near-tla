# NEP-141 resolver refund cap.  See RefundCap.tla.
#
#   python3 tools/run.py examples/nep141-refund-cap

spec = "RefundCap"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["RefundCapped", "OversizedRefunded", "Sane"]
tags = ["semantics:nep141-refund-cap"]

[constants]
Accounts = "Accts"
StakingAcct = '"u"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
TokYocto = "0"
TokenAccts = '{"ft"}'
WNearAccts = "{}"
TokHolders = "PTokHolders"
TokStorageMin = "PTokMin"
TokDev = "PTokDev"
TokCallReserve = "PTokReserve"
U = '"u"'
X = '"x"'
Y = '"y"'
FT = '"ft"'
MaxTx = "3"
Amts = "{1, 2}"
InitU = "2"
InitX = "1"
XResps = '{"keep", "return", "over", "mal", "panic"}'
Dev = "{}"

[[run]]
name = "refund_cap_std"
expect = "pass"

[[run]]
name = "refund_cap_nocap"
expect = "violation"
invariant = "RefundCapped"
[run.constants]
Dev = '{"resolveNoCap"}'

# X may answer a valid "0" padded to 43 bytes, one over the 42-byte bound of the
# resolver's checked read (near-contract-standards 5.24.0+): a full refund.
[[run]]
name = "refund_cap_oversized"
expect = "pass"
[run.constants]
XResps = '{"keep", "keepbig"}'

# The same with a resolver that reads the result unbounded (5.23.0) and honours the "0".
[[run]]
name = "refund_cap_oversized_unbounded"
expect = "violation"
invariant = "OversizedRefunded"
[run.constants]
XResps = '{"keep", "keepbig"}'
TokResolveMaxLen = '[t \in {"ft"} |-> -1]'
