# Per-byte storage staking against the fixed floor. See Vault.tla.
#
#   python3 tools/run.py examples/storage-stake
#
# Books       once idle, every user's NEAR equals the payouts recorded for them.
# PaidOnce    no user is paid twice.
# Sane        NEAR conserved; with StoragePerByte, every balance covers its bytes; no orphans.
# VaultCovered  V covers its bytes, checked without the library's storage test.
# BytesBooked V's bytes are its initial bytes plus the table's record bytes per recorded user.
#
# The pair is vault_per_byte_unrecorded (must fail) / vault_per_byte_atomic_ok (must pass);
# vault_floor_misses_it is the same wrong vault under the 0.1.0 fixed floor, a false pass.
# The vault_measured_* runs repeat them with the record's bytes from the measured table
# StorKv (Measured = TRUE: 40 + RecLen = 69 bytes) instead of the hand count RecBytes.

spec = "Vault"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Books", "PaidOnce", "Sane", "VaultCovered"]
tags = ["storage:per-byte"]

[constants]
Accounts = "Accts"
StakingAcct = '"v"'
MinStake = "1"
StorageFloor = "VFloor"
StorageInit = "VStor"
StorageByteCost = "Cost"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
TrackSigner = "FALSE"
Users = '{"u1", "u2"}'
V = '"v"'
MaxTx = "3"
RecBytes = "100"
V0 = "13"
Wrong = "TRUE"
StoragePerByte = "TRUE"
Measured = "FALSE"
RecLen = "29"

# The fixed floor (10 units, V's initial 1000 bytes) never sees the records' bytes: the
# second user's on_paid commits and Books holds.  A false pass.
[[run]]
name = "vault_floor_misses_it"
expect = "pass"
[run.constants]
StoragePerByte = "FALSE"

# Per byte: after the second payout V has 11 units; its record would make 1200 bytes, which
# need 12.  on_paid fails with LackBalanceForState: the user is paid but not recorded.
[[run]]
name = "vault_per_byte_unrecorded"
expect = "violation"
invariant = "Books"

# The record is written in the paying receipt: the second withdraw fails as a whole (no
# payout, no record) and Books holds.
[[run]]
name = "vault_per_byte_atomic_ok"
expect = "pass"
[run.constants]
Wrong = "FALSE"

# With one unit more (V0 = 14) two records fit: two users are paid, and PaidOnce and the
# "already paid" guard matter (at 13 the storage check alone stops every second payout).
[[run]]
name = "vault_per_byte_atomic_room"
expect = "pass"
[run.constants]
Wrong = "FALSE"
V0 = "14"

# ... and the first withdraw does pay: the pass above is not vacuous.
[[run]]
name = "vault_per_byte_atomic_pays"
expect = "violation"
invariant = "NobodyPaid"
invariants = ["NobodyPaid"]
[run.constants]
Wrong = "FALSE"

# ---- the record's bytes from the measured table (StorKv.tla, generated by the calibrator) ----
# The same verdicts at 69 bytes a record: one record fits in 12 units (1069 bytes need 10.69),
# a second does not in 11 (1138 need 11.38) but does in 12 (V0 = 14).

[[run]]
name = "vault_measured_unrecorded"
expect = "violation"
invariant = "Books"
[run.constants]
Measured = "TRUE"
StorBytes = "VaultStor"

[[run]]
name = "vault_measured_atomic_ok"
expect = "pass"
invariants = ["Books", "PaidOnce", "Sane", "VaultCovered", "BytesBooked"]
[run.constants]
Wrong = "FALSE"
Measured = "TRUE"
StorBytes = "VaultStor"

[[run]]
name = "vault_measured_atomic_room"
expect = "pass"
invariants = ["Books", "PaidOnce", "Sane", "VaultCovered", "BytesBooked"]
[run.constants]
Wrong = "FALSE"
V0 = "14"
Measured = "TRUE"
StorBytes = "VaultStor"

# Without StoragePerByte, OStorKey reads no table: the library's default, empty StorBytes
# raises no Assert, and the wrong vault is the same false pass as vault_floor_misses_it.
[[run]]
name = "vault_measured_floor_vacuous"
expect = "pass"
[run.constants]
StoragePerByte = "FALSE"
Measured = "TRUE"

# ---- anti-vacuity: python3 tools/run.py examples/storage-stake --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.
# vault_floor_misses_it and vault_measured_floor_vacuous are the documented false passes of
# the wrong vault and are left out.
# Only the wrong vault has a callback (on_paid), and every run of it must fail or is the
# false pass, so "dropped .then", "failure branch skips rollback" and "inverted result
# check" have no passing run to apply to.

# Books' antecedent: the vault settles after a withdraw.
[[witness]]
id = "settles"
expr = '~(Idle /\ ntx > 0)'
runs = ["vault_per_byte_atomic_ok", "vault_per_byte_atomic_room", "vault_measured_atomic_ok", "vault_measured_atomic_room"]

# Per-byte storage refuses a withdraw: V cannot cover one more record after the payout.
[[witness]]
id = "withdraw_short_of_storage"
expr = '~(\E r \in Runnable : r.m = "withdraw" /\ rec[r.a.u] = 0 /\ ~StorageCovers(near[V] - 1, stor[V] + RecB))'
runs = ["vault_per_byte_atomic_ok", "vault_measured_atomic_ok"]

# The "already paid" guard is exercised ...
[[witness]]
id = "withdraw_again"
expr = '~(\E r \in Runnable : r.m = "withdraw" /\ rec[r.a.u] > 0)'
runs = ["vault_per_byte_atomic_ok", "vault_per_byte_atomic_room", "vault_measured_atomic_ok", "vault_measured_atomic_room"]

# ... and with room for two records, by a second user who is paid.
[[witness]]
id = "two_paid"
expr = '~(\A u \in Users : rec[u] = 1)'
runs = ["vault_per_byte_atomic_room", "vault_measured_atomic_room"]

# The atomic vault never takes the lock.
[[witness]]
id = "lock_taken"
expr = '~(\E u \in Users : lockd[u])'
runs = ["vault_per_byte_atomic_ok", "vault_per_byte_atomic_room", "vault_measured_atomic_ok", "vault_measured_atomic_room"]
expect = "unreachable"
reason = "the atomic vault records in the paying receipt and never locks; the lock belongs to the wrong vault"

[[mutant]]
id = "no_paid_check"
file = "Vault.tla"
find = 'CASE r.m = "withdraw" /\ (lockd[u] \/ rec[u] > 0) ->'
replace = 'CASE r.m = "withdraw" /\ FALSE ->'
class = "removed precondition"
runs = ["vault_per_byte_atomic_ok", "vault_per_byte_atomic_room", "vault_measured_atomic_ok", "vault_measured_atomic_room"]

[[mutant]]
id = "paid_check_off_by_one"
file = "Vault.tla"
find = 'CASE r.m = "withdraw" /\ (lockd[u] \/ rec[u] > 0) ->'
replace = 'CASE r.m = "withdraw" /\ (lockd[u] \/ rec[u] > 1) ->'
class = "off-by-one guard"
runs = ["vault_per_byte_atomic_ok", "vault_per_byte_atomic_room", "vault_measured_atomic_ok", "vault_measured_atomic_room"]

# The payout goes back to V instead of the user.
[[mutant]]
id = "payout_to_vault"
file = "Vault.tla"
find = 'Pay(cb) == Rcpt(nid, r.tx, u, V, XFER, r.a, 1, V, cb)'
replace = 'Pay(cb) == Rcpt(nid, r.tx, V, V, XFER, r.a, 1, V, cb)'
class = "wrong refund account"
runs = ["vault_per_byte_atomic_ok", "vault_measured_atomic_ok"]

# The library forgets to check storage after a receipt.
[[mutant]]
id = "no_storage_check"
file = "NearAsync.tla"
library = true
find = 'IF bytes <= ZeroBalanceBytes THEN TRUE'
replace = 'IF TRUE THEN TRUE'
class = "removed precondition"
runs = ["vault_per_byte_atomic_ok", "vault_measured_atomic_ok"]

# A record booked at the table's bytes.
[[witness]]
id = "record_at_measured_bytes"
expr = '~(stor[V] = VStor[V] + RecB)'
runs = ["vault_measured_atomic_ok", "vault_measured_atomic_room"]

# The record falls back to the hand count: BytesBooked expects the table's 69 bytes, not 100.
[[mutant]]
id = "table_bypassed"
file = "Vault.tla"
find = 'Rec(O) == IF Measured THEN'
replace = 'Rec(O) == IF FALSE THEN'
class = "measured table not used"
runs = ["vault_measured_atomic_ok"]
killed_by = ["BytesBooked"]

# The handler names the overwrite's key (0 bytes) for a new record.
[[mutant]]
id = "wrong_table_key"
file = "Vault.tla"
find = 'OStorKey(O, V \o ".put/new", RecLen)'
replace = 'OStorKey(O, V \o ".put/same", RecLen)'
class = "wrong storage key"
runs = ["vault_measured_atomic_ok"]
killed_by = ["BytesBooked"]

# The library drops the table's bytes.
[[mutant]]
id = "table_bytes_dropped"
file = "NearAsync.tla"
library = true
find = 'IF StoragePerByte THEN OStor(O, StorDelta(O) + StorOf(k, n)) ELSE O'
replace = 'IF StoragePerByte THEN O ELSE O'
class = "dropped storage bytes"
runs = ["vault_measured_atomic_ok"]
killed_by = ["BytesBooked"]

# The library reads the table's base but not its per-size slope.
[[mutant]]
id = "table_slope_ignored"
file = "NearAsync.tla"
library = true
find = 'StorBytes[k].base + StorBytes[k].per * n'
replace = 'StorBytes[k].base'
class = "affine line read as a constant"
runs = ["vault_measured_atomic_ok"]
killed_by = ["BytesBooked"]

# ---- audit (docs/RUNNER.md, "Auditing what the runs reach") ----

# The model's methods: the calls users and other contracts make, and the callbacks.
[audit]
methods = ["on_paid", "withdraw"]
