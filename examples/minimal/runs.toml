# The minimal model of docs/TUTORIAL.md: a call, a callback that must check
# its promise result, fault mode and gas mode.  See Tally.tla.
#
#   python3 tools/run.py examples/minimal
#
# Counted  C's count of works matches D's once nothing is in flight.
# WorkFits (gas mode) at the 1000 Tgas maximum every work commits.
# Sane     NEAR conserved, gas bounded by each transaction's prepaid gas, no orphans.

spec = "Tally"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Counted", "Sane"]
# Fill the platform constants this model does not use (no staking, no storage floor,
# fault mode unless a run says otherwise): see `python3 tools/run.py --help`.
platform_defaults = true

# TLA+ expression text. Single quotes keep backslashes and double quotes literal.
[constants]
Accounts = 'Accts'
MayFail = '{}'                  # no forced faults unless a run allows them
MaxFails = '0'
TrackSigner = 'FALSE'           # the model never reads the signer
U = '"u"'
C = '"c"'
D = '"d"'
MaxTx = '2'
InitU = '2'
GasMenu = '{0}'
Trusting = 'FALSE'

# work may fail once; done checks the result, so the counts agree.
[[run]]
name = "tally_ok"
expect = "pass"
tags = ["semantics:callback-result"]
[run.constants]
MayFail = '{"work"}'
MaxFails = '1'

# Must fail: done counts without checking, and a failed work is counted.
[[run]]
name = "tally_trusting"
expect = "violation"
invariant = "Counted"
tags = ["semantics:callback-failure"]
[run.constants]
MayFail = '{"work"}'
MaxFails = '1'
Trusting = 'TRUE'

# Gas mode, no forced faults. ping needs 1.0 burn + (0.3 + 5) + (0.3 + 2) = 8.6 Tgas;
# the leftover goes to work (weight 1), which burns 5.5 of its 5 + leftover, so it runs
# out below 9.1 Tgas. The correct done keeps Counted at every prepaid amount.
[[run]]
name = "tally_gas_ok"
expect = "pass"
invariants = ["Counted", "WorkFits", "Sane"]
tags = ["gas:out-of-gas"]
[run.constants]
GasMode = '"gas"'
GasCall = 'TGasCall'
GasBurn = 'TGasBurn'
GasMenu = 'Menu'
MaxTx = '1'

# Must fail: the trusting done, with work out of gas (a "caller-gas" label).
[[run]]
name = "tally_gas_trusting"
expect = "violation"
invariant = "Counted"
tags = ["gas:out-of-gas"]
[run.constants]
GasMode = '"gas"'
GasCall = 'TGasCall'
GasBurn = 'TGasBurn'
GasMenu = 'Menu'
MaxTx = '1'
Trusting = 'TRUE'

# The same as a print-only window: Counted breaks for prepaid 8.6-9.0 Tgas.
[[run]]
name = "tally_gas_win"
expect = "pass"
invariants = ["WinCounted", "Sane"]
expect_window = "8600-9000"
tags = ["gas:window"]
[run.constants]
GasMode = '"gas"'
GasCall = 'TGasCall'
GasBurn = 'TGasBurn'
GasMenu = 'Menu'
MaxTx = '1'
Trusting = 'TRUE'

# ---- anti-vacuity: python3 tools/run.py examples/minimal --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.

# Counted's antecedent: the system settles again after a ping.
[[witness]]
id = "ping_settles"
expr = '~(Idle /\ ntx > 0)'
runs = ["tally_ok", "tally_gas_ok"]

# WorkFits' antecedent: a ping at the 1000 Tgas maximum settles.
[[witness]]
id = "settles_at_max_gas"
expr = '~(Idle /\ ntx > 0 /\ \A t \in 1..ntx : gas[t] = 1000000)'
runs = ["tally_gas_ok"]

# done's two arms: the work succeeded, the work failed (forced fault, or out of gas).
[[witness]]
id = "done_sees_ok"
expr = '~(\E r \in Runnable : r.m = "done" /\ ~IsFailed(r.res))'
runs = ["tally_ok", "tally_gas_ok"]

[[witness]]
id = "done_sees_failed"
expr = '~(\E r \in Runnable : r.m = "done" /\ IsFailed(r.res))'
runs = ["tally_ok", "tally_gas_ok"]

[[mutant]]
id = "dropped_then"
file = "Tally.tla"
find = 'IN Outcome({w}, {cb}, RProm, 0, 2)'
replace = 'IN Outcome({w}, {}, RProm, 0, 2)'
class = "dropped .then"
runs = ["tally_ok"]

[[mutant]]
id = "failed_work_counted"
file = "Tally.tla"
find = 'THEN n + 1 ELSE n'
replace = 'THEN n + 1 ELSE n + 1'
class = "failure branch skips rollback"
runs = ["tally_ok", "tally_gas_ok"]

[[mutant]]
id = "failed_check_inverted"
file = "Tally.tla"
find = 'IF Trusting \/ ~IsFailed(r.res)'
replace = 'IF Trusting \/ IsFailed(r.res)'
class = "inverted result check"
runs = ["tally_ok", "tally_gas_ok"]

# The weights swapped: done gets the leftover, work only its 5 Tgas static and always runs
# out of gas. Counted still holds (done sees Failed); WorkFits catches it.
[[mutant]]
id = "weights_swapped"
file = "Tally.tla"
find = '''("work" :> GC(<<5000>>, <<1>>, 300))     \* 5 Tgas static + all the leftover
         @@ ("done" :> GC(<<2000>>, <<0>>, 300))'''
replace = '''("work" :> GC(<<5000>>, <<0>>, 300))     \* 5 Tgas static + all the leftover
         @@ ("done" :> GC(<<2000>>, <<1>>, 300))'''
class = "wrong weight"
runs = ["tally_gas_ok"]

# ---- audit (docs/RUNNER.md, "Auditing what the runs reach") ----

# C's methods, from the source: the call users make and the callback it schedules.
[audit]
methods = ["ping", "done"]

[audit.accept]
"done trie" = "done writes no storage in this toy (H_done declares no write)"
"done least-gas" = "done's budget is a fixed 2 Tgas against a 0.6 Tgas burn; tally_gas_win maps the prepaid edge"
