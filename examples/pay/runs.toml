# Pay: a contract C pays out of an internal balance through ft_transfer_call and
# reconciles in its callback on_paid. See the comments in Pay.tla.
#
#   python3 tools/run.py examples/pay
#
# Books   C's internal balance matches its FT balance once nothing is in flight.
# Honored a settled pay was refunded what the receiver asked back, capped at amt (NEP-141).
# NoOverdraft  C never pays out more than ib holds.
# Sane    native NEAR conserved, token supply = sum of balances, balance domains, no orphans.

spec = "Pay"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Books", "Honored", "NoOverdraft", "Sane"]

# Shared constants; each run overrides a few. Values are TLA+ expression text.
[constants]
Accounts = "Accts"
StakingAcct = '"c"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
TokYocto = "0"
TokenAccts = '{"ft"}'
WNearAccts = "{}"
TokHolders = "PTokHolders"
TokStorageMin = "PTokMin"
TokDev = "PTokDev"
TokCallReserve = "PTokReserve"
U = '"u"'
C = '"c"'
FT = '"ft"'
RX = '"rx"'
MaxTx = "2"
Amts = "{1, 2}"
InitC = "2"
InitRx = "1"
RxResps = '{"keep", "return", "over", "mal", "panic"}'
RxReg = "TRUE"
Dev = "{}"
GasMenu = "{0}"

# Standard FT, two pay transactions, every receiver behaviour.
[[run]]
name = "pay_std"
expect = "pass"
tags = ["tokens:nep141", "semantics:callback-result"]

# The receiver is not registered on FT: ft_transfer_call panics, on_paid sees Failed
# and credits the full amount back.
[[run]]
name = "pay_unreg"
expect = "pass"
tags = ["tokens:nep145", "semantics:callback-result"]
[run.constants]
RxReg = "FALSE"

# A token whose resolver ignores the receiver's answer: when the receiver returns
# everything, the resolver leaves it with the receiver.
[[run]]
name = "pay_ignore"
expect = "violation"
invariant = "Honored"
tags = ["tokens:deviation"]
[run.constants]
Dev = '{"resolveIgnoresResult"}'

# A token whose resolver does not cap the refund at amt: the receiver (which holds 1)
# answers amt + 1, and the resolver pulls one of its own tokens into C.
[[run]]
name = "pay_nocap"
expect = "violation"
invariant = "Books"
tags = ["tokens:deviation"]
[run.constants]
Dev = '{"resolveNoCap"}'

# One forced failure of on_paid: the tokens come back to C but ib is never credited.
[[run]]
name = "pay_forced"
expect = "violation"
invariant = "Books"
tags = ["semantics:callback-failure"]
[run.constants]
MayFail = '{"on_paid"}'
MaxFails = "1"

# Gas mode with the illustrative table, one transaction, prepaid 39.0-42.0 Tgas in
# 0.1 steps plus 300 Tgas. pay needs 2.0 burn + 2 x 0.9 fees + 35 + 1 static = 39.8 Tgas;
# from there on_paid can run out of gas, so the first violation is at 39.8 Tgas.
# The token uses the default "standard" gas shape (near-contract-standards 5.x):
# ft_transfer_call needs 1.6 burn + 0.9 (ft_on_transfer fee, static 0) + 0.9 + 5
# (resolver) = 8.4 Tgas of its >= 35 and gives the rest to ft_on_transfer (weight 1).
# Nothing on the token side runs out, so the window depends on pay / on_paid only;
# with TokFtGasShape "reserve" (3.x: ft_on_transfer static = prepaid - 30 Tgas,
# weight 0) it is the same.
[[run]]
name = "pay_gas"
expect = "violation"
invariant = "Books"
# One worker keeps the breadth-first search order (and so the reported trace) deterministic.
workers = 1
expect_output = 'gas \|-> 39800\]>>'
tags = ["gas:out-of-gas", "semantics:callback-failure"]
[run.constants]
GasMode = '"gas"'
GasCall = "PGasCall"
GasBurn = "PGasBurn"
GasMenu = "PayMenu"
MaxTx = "1"
Amts = "{1}"

# Same, with the print-only WinBooks: the leftover gas is split 1:1 between
# ft_transfer_call and on_paid; on_paid gets 1 + left/2 and burns 1.5, so it runs out
# for left < 1.0 Tgas, i.e. prepaid 39.8-40.7 Tgas.
[[run]]
name = "pay_gas_win"
expect = "pass"
invariants = ["WinBooks"]
expect_window = "39800-40700"
tags = ["gas:window"]
[run.constants]
GasMode = '"gas"'
GasCall = "PGasCall"
GasBurn = "PGasBurn"
GasMenu = "PayMenu"
MaxTx = "1"
Amts = "{1}"

# Same window with the token side measured (CalibStd, near-contract-standards 5.29.1).
# The window is set by pay / on_paid alone (see pay_gas): on_paid gets 1 Tgas + half
# of (prepaid - 39.8 Tgas) and burns 1.5. It holds as long as the token side fits in
# ft_transfer_call's 35 Tgas: StdFt ft_transfer_call burn (1.592) + 0.9 + resolver
# fee (0.889) + resolver static (5) = 8.4 Tgas, and the resolver burn (0.859 with a
# refund, 0.417 without) fits in its 5 Tgas. A recalibration that moves burns by a few
# Ggas keeps 39800-40700.
[[run]]
name = "pay_gas_std"
expect = "pass"
invariants = ["WinBooks", "Sane"]
expect_window = "39800-40700"
tags = ["gas:window", "gas:calibrated"]
[run.constants]
GasMode = '"gas"'
GasCall = "PStdGasCall"
GasBurn = "PStdGasBurn"
GasMenu = "PayMenu"
MaxTx = "1"
Amts = "{1}"

# ---- anti-vacuity: python3 tools/run.py examples/pay --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.

# Books' antecedent: the system settles again after a pay.
[[witness]]
id = "pay_settles"
expr = '~(Idle /\ ntx > 0)'
runs = ["pay_std", "pay_unreg"]

# Honored's antecedent: a pay settles with on_paid done.
[[witness]]
id = "pay_done"
expr = '~(\E t \in 1..ntx : TxSettled(t) /\ gT[t].done)'
runs = ["pay_std", "pay_unreg"]

# The guard ib < amt: a pay at exactly the balance, and one refused.
[[witness]]
id = "pay_at_balance"
expr = '~(\E r \in Runnable : r.m = "pay" /\ ib = r.a.amt)'
runs = ["pay_std"]

[[witness]]
id = "pay_refused"
expr = '~(\E r \in Runnable : r.m = "pay" /\ ib < r.a.amt)'
runs = ["pay_std"]

# on_paid's three arms: the resolver's number, Failed, and other bytes.
[[witness]]
id = "on_paid_sees_value"
expr = '~(\E r \in Runnable : r.m = "on_paid" /\ IsNum(r.res))'
runs = ["pay_std"]

[[witness]]
id = "on_paid_sees_failed"
expr = '~(\E r \in Runnable : r.m = "on_paid" /\ ~r.res.ok)'
runs = ["pay_unreg"]

[[witness]]
id = "on_paid_sees_failed_std"
expr = '~(\E r \in Runnable : r.m = "on_paid" /\ ~r.res.ok)'
runs = ["pay_std"]
expect = "unreachable"
reason = "with RX registered and ib backing every pay, ft_transfer_call never panics; pay_unreg reaches this arm"

[[witness]]
id = "on_paid_sees_bytes"
expr = '~(\E r \in Runnable : r.m = "on_paid" /\ r.res.ok /\ ~IsNum(r.res))'
runs = ["pay_std", "pay_unreg"]
expect = "unreachable"
reason = "the resolver always returns its used amount as a number; the arm is defensive"

[[mutant]]
id = "dropped_then"
file = "Pay.tla"
find = 'ELSE <<Outcome({ftc}, {cb}, RProm, TokYocto, 2), ib - amt>>'
replace = 'ELSE <<Outcome({ftc}, {}, RProm, TokYocto, 2), ib - amt>>'
class = "dropped .then"

[[mutant]]
id = "failed_not_credited"
file = "Pay.tla"
find = 'ELSE IF ~r.res.ok THEN 0 ELSE amt'
replace = 'ELSE amt'
class = "failure branch skips rollback"
runs = ["pay_unreg"]

[[mutant]]
id = "failed_check_inverted"
file = "Pay.tla"
find = 'ELSE IF ~r.res.ok THEN 0 ELSE amt'
replace = 'ELSE IF r.res.ok THEN 0 ELSE amt'
class = "inverted result check"

[[mutant]]
id = "used_read_as_unused"
file = "Pay.tla"
find = 'IF IsNum(r.res) THEN TMin(r.res.v, amt)'
replace = 'IF IsNum(r.res) THEN amt - TMin(r.res.v, amt)'
class = "inverted result check"
runs = ["pay_std"]

[[mutant]]
id = "no_balance_check"
file = "Pay.tla"
find = 'IN IF ib < amt THEN'
replace = 'IN IF FALSE THEN'
class = "removed precondition"

[[mutant]]
id = "balance_check_off_by_one"
file = "Pay.tla"
find = 'IN IF ib < amt THEN'
replace = 'IN IF ib + 1 < amt THEN'
class = "off-by-one guard"

# The library resolver leaves the refund with the receiver instead of crediting C.
[[mutant]]
id = "refund_stays_with_receiver"
file = "Nep141.tla"
library = true
find = '!.bal[rc] = @ - refund, !.bal[s] = @ + refund]'
replace = '!.bal[rc] = @, !.bal[s] = @]'
class = "wrong refund account"
runs = ["pay_std"]
