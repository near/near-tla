# Yield timeouts on the block clock (blk, BlockTick, YieldTicks, MaxBlk). See Deadline.tla.
#
#   python3 tools/run.py examples/yield-clock

spec = "Deadline"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Books", "NoNegEscrow", "Settled", "Forgotten", "NoEarlyCancel", "CancelHonoured", "Sane"]
tags = ["semantics:yield-timeout"]

[constants]
Accounts = "Accts"
StakingAcct = '"q"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"fault"'
GasCall = "NoGasTable"
GasBurn = "NoGasTable"
LogOn = "FALSE"
MaxTx = "3"
Steps = '{"request", "answer"}'
CancelAt = "0"
Bug = '"none"'
YieldTicks = "2"

# Timed, without cancel: no timeout before its deadline, and the bound was never reached by a
# pending deadline (3 requests x 2 ticks).  No handler's behaviour depends on blk here
# (request only records it), so ticking only while a deadline is ahead is exact.
[[run]]
name = "yield_ok_timed"
expect = "pass"
invariants = ["Books", "NoNegEscrow", "Settled", "Forgotten", "Sane", "NoEarlyTimeout", "YieldDeadlinesInBound"]
[run.constants]
MaxBlk = "6"
TickAnytime = "FALSE"

# A bound below a deadline: at blk = MaxBlk the yield may time out early (saturation).
# YieldDeadlinesInBound reports it ...
[[run]]
name = "yield_saturation_flagged"
expect = "violation"
invariant = "YieldDeadlinesInBound"
invariants = ["YieldDeadlinesInBound"]
[run.constants]
MaxBlk = "1"
TickAnytime = "FALSE"

# ... and the early timeout is visible.
[[run]]
name = "yield_saturated_early"
expect = "violation"
invariant = "NoEarlyTimeout"
invariants = ["NoEarlyTimeout"]
[run.constants]
MaxBlk = "1"
TickAnytime = "FALSE"

# cancel reads blk, so blocks pass freely (TickAnytime, the default).  A bounded pass: with
# 3 transactions HorizonOK needs MaxBlk >= (2 * 3 + 1) * CancelAt = 21, so behaviours that need a
# later height (a request late in the run, then its cancel window) are not explored here.
[[run]]
name = "cancel_guarded"
expect = "pass"
[run.constants]
Steps = '{"request", "answer", "cancel"}'
MaxBlk = "4"
CancelAt = "3"

# Timeouts fire late: the timeout's callback runs after the deadline and after U's cancel,
# and refunds a second time.
[[run]]
name = "cancel_trusts_timeout"
expect = "violation"
invariant = "NoNegEscrow"
[run.constants]
Steps = '{"request", "answer", "cancel"}'
MaxBlk = "4"
CancelAt = "3"
Bug = '"trusts_timeout"'

# A callback can be delayed past the cancel height: cancel refunds a request that was
# answered (O paid) while its callback is in flight.  TickAnytime <- FALSE hides this: with
# one request the clock stops at its deadline (at + 2) while the answer is in flight, below
# at + CancelAt.
[[run]]
name = "cancel_after_answer"
expect = "violation"
invariant = "NoNegEscrow"
[run.constants]
Steps = '{"request", "answer", "cancel"}'
MaxBlk = "4"
CancelAt = "3"
Bug = '"after_answer"'

# The bounded clock is an under-approximation.  One request, at height 0 (ReqUntil), then a
# cancel; cancel opens at height 3 (CancelAt), the deadline is 2.  With MaxBlk = 2 the cancel
# never opens, so trusts_timeout passes NoNegEscrow, and YieldDeadlinesInBound holds too (no
# deadline past the bound): neither says the bound was too small.
[[run]]
name = "horizon_short_passes"
expect = "pass"
invariants = ["NoNegEscrow", "YieldDeadlinesInBound"]
[run.constants]
MaxTx = "2"
Steps = '{"request", "cancel"}'
CancelAt = "3"
ReqUntil = "0"
MaxBlk = "2"
Bug = '"trusts_timeout"'

# ... HorizonOK does (it needs MaxBlk >= (2 * 2 + 1) * 3 = 15: 4 clock-relevant steps and the
# final observation, see examples/yield-clock/final-observation) ...
[[run]]
name = "horizon_short_flagged"
expect = "violation"
invariant = "HorizonOK"
invariants = ["HorizonOK", "NoNegEscrow", "YieldDeadlinesInBound"]
[run.constants]
MaxTx = "2"
Steps = '{"request", "cancel"}'
CancelAt = "3"
ReqUntil = "0"
MaxBlk = "2"
Bug = '"trusts_timeout"'

# ... and one more block shows the bug: the timeout is delayed past height 3, U cancels, then
# the timeout's callback refunds again.
[[run]]
name = "horizon_bug_found"
expect = "violation"
invariant = "NoNegEscrow"
invariants = ["NoNegEscrow", "YieldDeadlinesInBound"]
[run.constants]
MaxTx = "2"
Steps = '{"request", "cancel"}'
CancelAt = "3"
ReqUntil = "0"
MaxBlk = "3"
Bug = '"trusts_timeout"'

# The correct handler at a justified bound: HorizonOK holds, so this pass covers every
# behaviour of the model, at any height.
[[run]]
name = "horizon_justified"
expect = "pass"
invariants = ["Books", "NoNegEscrow", "Settled", "Forgotten", "NoEarlyCancel", "CancelHonoured", "Sane",
              "NoEarlyTimeout", "YieldDeadlinesInBound", "HorizonOK"]
[run.constants]
MaxTx = "2"
Steps = '{"request", "answer", "cancel"}'
CancelAt = "3"
ReqUntil = "0"
MaxBlk = "15"

# ---- anti-vacuity: python3 tools/run.py examples/yield-clock --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.
# horizon_short_passes is a documented false pass of a wrong handler: no check uses it.

# The antecedent of Books, Settled and Forgotten: the system settles after a request.
[[witness]]
id = "request_settles"
expr = '~(Idle /\ ntx > 0)'
runs = ["yield_ok_timed", "cancel_guarded", "horizon_justified"]

# on_answer's arms: resumed, timed out, and a request already cancelled.
[[witness]]
id = "on_answer_resumed"
expr = '~(\E r \in Runnable : r.m = "on_answer" /\ ~IsFailed(r.res))'
runs = ["yield_ok_timed", "cancel_guarded", "horizon_justified"]

[[witness]]
id = "on_answer_timed_out"
expr = '~(\E r \in Runnable : r.m = "on_answer" /\ IsFailed(r.res))'
runs = ["yield_ok_timed", "cancel_guarded", "horizon_justified"]

[[witness]]
id = "on_answer_after_cancel"
expr = '~(\E r \in Runnable : r.m = "on_answer" /\ r.a.y \notin DOMAIN reqs)'
runs = ["cancel_guarded", "horizon_justified"]

# The deadline's boundary: a timeout delivered exactly at at + YieldTicks.
[[witness]]
id = "timeout_at_deadline"
expr = '~(\E r \in Runnable : r.m = "on_answer" /\ IsFailed(r.res) /\ r.a.y \in DOMAIN reqs /\ blk = reqs[r.a.y].at + YieldTicks)'
runs = ["yield_ok_timed"]

# cancel's arms: refused before the window, and committed exactly as it opens.
[[witness]]
id = "cancel_before_window"
expr = '~(\E r \in Runnable : r.m = "cancel" /\ r.a.y \in DOMAIN reqs /\ blk < reqs[r.a.y].at + CancelAt)'
runs = ["cancel_guarded", "horizon_justified"]

[[witness]]
id = "cancel_as_window_opens"
expr = '~(\E r \in Runnable : r.m = "cancel" /\ r.a.y \in DOMAIN reqs /\ reqs[r.a.y].st = "open" /\ blk = reqs[r.a.y].at + CancelAt)'
runs = ["cancel_guarded", "horizon_justified"]

# A request at a height above 0, so that a wrongly recorded height can show.
[[witness]]
id = "request_after_genesis"
expr = '~(\E y \in DOMAIN reqs : reqs[y].at > 0)'
runs = ["yield_ok_timed", "cancel_guarded"]

[[witness]]
id = "request_after_genesis_horizon"
expr = '~(\E y \in DOMAIN reqs : reqs[y].at > 0)'
runs = ["horizon_justified"]
expect = "unreachable"
reason = "ReqUntil = 0: request fails above height 0 in this run"

[[mutant]]
id = "dropped_yield"
file = "Deadline.tla"
find = 'Outcome({}, {YieldRcpt(nid, r, "on_answer", Arg(nid), 0, r.cb)}, RProm, 0, 1)'
replace = 'Outcome({}, {}, RProm, 0, 1)'
class = "dropped .then"
runs = ["yield_ok_timed"]

[[mutant]]
id = "timeout_not_refunded"
file = "Deadline.tla"
find = 'THEN [K EXCEPT !.cr = cr + 1, !.esc = esc - 1, !.reqs = Forget(y)]   \* timed out'
replace = 'THEN [K EXCEPT !.reqs = Forget(y)]   \* timed out'
class = "failure branch skips rollback"
runs = ["yield_ok_timed"]

[[mutant]]
id = "timeout_check_inverted"
file = "Deadline.tla"
find = 'ELSE IF IsFailed(r.res)'
replace = 'ELSE IF ~IsFailed(r.res)'
class = "inverted result check"
runs = ["yield_ok_timed"]

[[mutant]]
id = "no_cancel_window"
file = "Deadline.tla"
find = '\/ blk < reqs[y].at + CancelAt'
replace = '\/ FALSE'
class = "removed precondition"
runs = ["cancel_guarded", "horizon_justified"]

[[mutant]]
id = "cancel_window_off_by_one"
file = "Deadline.tla"
find = '\/ blk < reqs[y].at + CancelAt'
replace = '\/ blk <= reqs[y].at + CancelAt'
class = "off-by-one guard"
runs = ["cancel_guarded", "horizon_justified"]

[[mutant]]
id = "height_recorded_as_zero"
file = "Deadline.tla"
find = '!.reqs = (nid :> [at |-> blk, st |-> "open"]) @@ reqs'
replace = '!.reqs = (nid :> [at |-> 0, st |-> "open"]) @@ reqs'
class = "wrong recorded value"
runs = ["cancel_guarded"]

[[mutant]]
id = "timeout_keeps_request"
file = "Deadline.tla"
find = 'THEN [K EXCEPT !.cr = cr + 1, !.esc = esc - 1, !.reqs = Forget(y)]   \* timed out'
replace = 'THEN [K EXCEPT !.cr = cr + 1, !.esc = esc - 1]   \* timed out'
class = "state leak"
runs = ["yield_ok_timed"]

# The library times a yield out one block early.
[[mutant]]
id = "library_timeout_one_early"
file = "NearAsync.tla"
library = true
find = '/\ (blk >= p.ydl \/ blk >= MaxBlk)'
replace = '/\ (blk + 1 >= p.ydl \/ blk >= MaxBlk)'
class = "off-by-one guard"
runs = ["yield_ok_timed"]

# ---- audit (docs/RUNNER.md, "Auditing what the runs reach") ----

# The model's methods: the calls users and other contracts make, and the callbacks.
[audit]
methods = ["answer", "cancel", "on_answer", "request"]
