# A gas budget at the edge of a Transfer fee, under both NearFees.FeeRounding modes.
# See Edge.tla.
#
#   python3 tools/run.py examples/fee-edge
#
# Delivered  once idle, the Transfer has reached To.
# Sane       NEAR conserved, gas bounded by the prepaid gas.
#
# The pair is edge_up_catches (must fail) / edge_up_ok (must pass);
# edge_nearest_misses is why "up" is the default.

spec = "Edge"
workers = 2
library = "../../modules"
budget_s = 60
invariants = ["Delivered", "Sane"]
tags = ["gas:fee-rounding"]

[constants]
Accounts = "Accts"
StakingAcct = '"p"'
MinStake = "1"
StorageFloor = "PFloor"
MayFail = "{}"
MaxFails = "0"
MaxEpoch = "0"
MaxReward = "0"
Exists = "Accts"
GasMode = '"gas"'
GasCall = "PGasCall"
GasBurn = "PGasBurn"
LogOn = "FALSE"
U = '"u"'
P = '"p"'
R = '"r"'
To = '"bob"'
Amt = "2"
Attach = "446"

# 446 Ggas is 0.37 short of the real 446.37, but "nearest" prices the
# Transfer at 446: a false pass.
[[run]]
name = "edge_nearest_misses"
expect = "pass"
[run.constants]
"NearFees!FeeRounding" = '"nearest"'

# Must fail: "up" prices it at 450, so 446 runs out of gas, as in nearcore.
[[run]]
name = "edge_up_catches"
expect = "violation"
invariant = "Delivered"

# 447 is enough in nearcore; "up" overstates by up to 4 Ggas per receipt.
[[run]]
name = "edge_up_tight_false_cex"
expect = "violation"
invariant = "Delivered"
[run.constants]
Attach = "447"

# Must pass: the budget "up" asks for.
[[run]]
name = "edge_up_ok"
expect = "pass"
[run.constants]
Attach = "450"

[[run]]
name = "edge_nearest_ok"
expect = "pass"
[run.constants]
Attach = "450"
"NearFees!FeeRounding" = '"nearest"'

# ---- anti-vacuity: python3 tools/run.py examples/fee-edge --anti-vacuity ----
# Witnesses must be reached (TLC violates Wit_<id>); mutants must be killed by a run.
# edge_nearest_misses is a documented false pass and is left out. No callback reads a
# result and no passing run refunds a deposit, so "dropped .then", "failure branch skips
# rollback", "inverted result check" and "wrong refund account" do not apply.

# Delivered's antecedent: the payment settles, and To is paid.
[[witness]]
id = "pay_settles"
expr = '~(sent /\ Idle)'
runs = ["edge_up_ok", "edge_nearest_ok"]

[[witness]]
id = "to_paid"
expr = 'near[To] # Amt'
runs = ["edge_up_ok", "edge_nearest_ok"]

[[mutant]]
id = "attach_one_short"
file = "Edge.tla"
find = '<<ForwardBurn + Attach>>'
replace = '<<ForwardBurn + Attach - 1>>'
class = "off-by-one guard"
runs = ["edge_up_ok", "edge_nearest_ok"]

# The library rounds fees to the nearest Ggas again.  That only makes budgets look
# enough sooner, so no passing run can catch it; edge_up_catches (must fail) does.
[[mutant]]
id = "fees_rounded_nearest"
file = "NearFees.tla"
library = true
find = 'FeeRounding == "up"'
replace = 'FeeRounding == "nearest"'
class = "fee rounding"
runs = ["edge_up_ok"]
equivalent = "a cheaper fee cannot fail a budget that the dearer one passes; the must-fail edge_up_catches turns into a pass under it"

# ---- audit (docs/USAGE.md, "Auditing what the runs reach") ----

# The model's methods: the calls users and other contracts make, and the callbacks.
[audit]
methods = ["forward", "pay"]
