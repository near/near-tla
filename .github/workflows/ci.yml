name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # TLC 2.19 (tla2tools v1.7.4). v1.8.0 is a rolling prerelease and cannot be pinned.
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

# There is no Rust job: the conformance suite (conformance/) needs a local nearcore
# simulator and runs locally only. See docs/CONFORMANCE.md.

jobs:
  tla:
    runs-on: warp-ubuntu-2404-x64-2x
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hygiene (no absolute home paths in tracked files)
        run: |
          # The character classes keep this pattern from matching its own source line.
          if git ls-files -z | xargs -0 grep -nIE '/User[s]/|/hom[e]/[^/[:space:]]+/'; then
            echo "::error::absolute home paths found (write ~ instead)"
            exit 1
          fi

      - name: Markdown link check (relative links and anchors, offline)
        run: python3 tools/check_links.py

      - name: Runner self-tests
        run: python3 -m unittest tools/test_run.py

      - name: Fetch tla2tools.jar
        run: |
          mkdir -p tools
          curl -sSfL -o tools/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  tools/tla2tools.jar" | sha256sum -c -

      - name: SANY-parse every module and example spec
        # tools/sany.py fails on SANY's error output too: SANY 1.7.4 can exit 0 on semantic errors.
        run: python3 tools/sany.py modules examples

      - name: TLC runs (every expectation in examples/*/runs.toml)
        run: python3 tools/run.py examples/

      - name: Upload TLC logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-logs
          path: examples/*/build/
          if-no-files-found: ignore
