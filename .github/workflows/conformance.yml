name: conformance

# The sim conformance suite (conformance/): every sim test, a full sweep of each flow set's flows
# (probes, probes2, mt: conformance/scripts/flowsets.py), the generated tables regenerated and diffed
# against the committed ones, then the model side (TLC on every flow of each set) and conform.py.
# Nightly and on demand only: near-contract-sim pulls in nearcore, so a cold build is slow.
# Nothing gates on this workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance
  cancel-in-progress: false

env:
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  CARGO_TARGET_DIR: ${{ github.workspace }}/conformance/target
  CARGO_TERM_COLOR: never

jobs:
  conformance:
    runs-on: warp-ubuntu-2404-x64-4x
    timeout-minutes: 180
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.13"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # nearcore's build needs libclang (bindgen), cmake, protoc and OpenSSL headers.
      - name: System packages for the nearcore build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang libclang-dev llvm-dev cmake pkg-config libssl-dev protobuf-compiler

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install 1.95.0 --profile minimal && cargo --version

      - name: Restore the cargo registry, git cache and target
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/target
          key: conformance-${{ runner.os }}-rust1.95.0-${{ hashFiles('conformance/Cargo.lock', 'conformance/rust-toolchain.toml') }}
          restore-keys: conformance-${{ runner.os }}-rust1.95.0-

      # cargo fetches near-contract-sim (public; pinned by tag in Cargo.toml, by rev in Cargo.lock)
      # over https here; every later cargo step runs offline.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build (release; tests and the calibrator)
        id: build
        run: cargo build --release --offline --locked --tests --bins

      - name: Save the cargo cache
        if: steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/target
          key: conformance-${{ runner.os }}-rust1.95.0-${{ hashFiles('conformance/Cargo.lock', 'conformance/rust-toolchain.toml') }}

      - name: Sim tests (every suite, one at a time)
        run: cargo test --release --offline --locked -- --test-threads 1

      - name: Full sweep of every probe flow (standard grid) and the calibration report
        run: cargo run --release --offline --locked --bin calibrate -- --flows flows/probes.toml

      - name: Full sweep of every probe2 flow (standard grid) and the calibration report
        run: cargo run --release --offline --locked --bin calibrate -- --flows flows/probes2.toml

      - name: Full sweep of every multi-token flow (standard grid) and the calibration report
        run: cargo run --release --offline --locked --bin calibrate -- --flows flows/mt.toml

      - name: Regenerate the gas and storage tables; they must match the committed ones
        run: |
          set -euo pipefail
          run() { cargo run -q --release --offline --locked --bin calibrate -- "$@"; }
          run --flows flows/probes.toml --from-data \
            --merge-accts ft_probe,wnear_probe --batch-actions --tla tla/CalibProbes.tla --prefix Probe
          run --flows flows/probes2.toml --from-data --tla tla/CalibProbes2.tla --prefix Probe2
          run --flows flows/mt.toml --from-data --merge-accts mt --tla tla/CalibMt.tla --prefix Mt
          run --flows flows/probes.toml --from-data \
            --merge-accts ft_probe,wnear_probe --batch-actions \
            --group ft_probe:StdFt:ft --group wnear_probe:StdWNear:wnear \
            --tla ../modules/CalibStd.tla --module CalibStd --notes flows/calibstd.notes
          run --flows flows/mt.toml --from-data --merge-accts mt --group mt:StdMt:mt \
            --tla ../modules/CalibStdMt.tla --module CalibStdMt --notes flows/calibstdmt.notes
          run --flows flows/storage.toml --stor --merge-accts ft_probe,wnear_probe \
            --group ft_probe:StdFt:ft --group wnear_probe:StdWNear:wnear \
            --tla ../modules/StorStd.tla --module StorStd --notes flows/storstd.notes
          run --flows flows/storage.toml --stor --group p:Kv:app \
            --tla ../examples/storage-stake/StorKv.tla --module StorKv --notes flows/storkv.notes
          git diff --exit-code -- tla/CalibProbes.tla tla/CalibProbes2.tla tla/CalibMt.tla ../modules/CalibStd.tla \
            ../modules/CalibStdMt.tla \
            ../modules/StorStd.tla ../examples/storage-stake/StorKv.tla

      - name: Fetch tla2tools.jar
        run: |
          mkdir -p ../tools
          curl -sSfL -o ../tools/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  ../tools/tla2tools.jar" | sha256sum -c -

      - name: Model side (TLC on every flow of each set, 2 workers)
        run: |
          set -euo pipefail
          for s in probes probes2 mt; do
            python3 scripts/mkconf.py --set "$s"
            scripts/tlc.sh --set "$s"
          done

      - name: Compare model and sim (conform.py, each set)
        run: |
          rc=0
          for s in probes probes2 mt; do python3 scripts/conform.py --set "$s" || rc=1; done
          exit $rc

      - name: Upload TLC logs and the sweep's provenance
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-logs
          path: |
            conformance/tla/build/**/*.log
            conformance/data/*/*.meta.json
          if-no-files-found: ignore
