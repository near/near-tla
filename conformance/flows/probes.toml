signer = "alice.near"
receiver = "ft.near"
method = "storage_deposit"
args = '{"account_id": "q.near"}'
deposit = "1250000000000000000000"

[[setup]]
signer = "alice.near"
receiver = "ft.near"
method = "storage_deposit"
args = '{"account_id": "p.near"}'
