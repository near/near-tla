receiver = "wnear-probe.near"
method = "near_deposit"
deposit = "10000000000000000000000000"

# p-probe.near holds tokens of its own, for the batches it sends
[[setup]]
signer = "alice.near"
receiver = "ft-probe.near"
method = "ft_transfer"
args = '{"receiver_id": "p-probe.near", "amount": "100000"}'
deposit = "1"

[[setup]]
signer = "p-probe.near"
receiver = "wnear-probe.near"
method = "near_deposit"
deposit = "1000000000000000000000000"

# Standard-token statics (near-contract-standards 5.29.1,
# fungible_token/core_impl.rs: ft_on_transfer gets static 0 and the
# leftover by weight 1; ft_resolve_transfer static 5 Tgas, weight 0).
[[static]]
child = "q-probe.near.ft_on_transfer"
actions = [[0, 1]]

[[static]]
child = "ft-probe.near.ft_resolve_transfer"
actions = [[5000, 0]]

[[static]]
child = "wnear-probe.near.ft_resolve_transfer"
actions = [[5000, 0]]

# Token burn paths read from the receipt's logs (the library's path keys,
# modules/Nep145.tla PathKey): storage_deposit for a registered account
# logs its refund; a resolver that refunds logs an ft_transfer event with
# memo "refund". near_deposit logs nothing: its flows name the path.
[[path_rule]]
call = "ft-probe.near.storage_deposit"
log = "already registered"
path = "registered"
else = "new"

[[path_rule]]
call = "wnear-probe.near.storage_deposit"
log = "already registered"
path = "registered"
else = "new"

[[path_rule]]
call = "ft-probe.near.ft_resolve_transfer"
log = '"memo":"refund"'
path = "refund"
else = "norefund"

[[path_rule]]
call = "wnear-probe.near.ft_resolve_transfer"
log = '"memo":"refund"'
path = "refund"
else = "norefund"

# The async probe's paths, from its logs: a resume the host accepted or
# not; a yield callback that got a payload or timed out.
[[path_rule]]
call = "y-probe.near.resume"
log = "resume ok"
path = "ok"
else = "none"

[[path_rule]]
call = "y-probe.near.on_yield"
log = "timeout"
path = "timeout"
else = "payload"

# Burn sizes: burn(ggas) by its argument; ret(bytes) and on_read by the
# bytes returned / read, in KB (1000 bytes).
[[size]]
key = "q-probe.near.burn"
from = "arg:ggas"

[[size]]
key = "p-probe.near.burn"
from = "arg:ggas"

[[size]]
key = "q-probe.near.ret"
from = "arg:bytes"
div = 1000

[[size]]
key = "p-probe.near.on_read"
from = "result"
div = 1000

[[flow]]
name = "chain1"
about = "q.burn(2000) static 5000 w1, then p.on_read static 5000 w1"
grid = "standard"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "chain", args = '{"kids": [{"method": "burn", "args": "{\"ggas\":2000}", "static_ggas": 5000, "weight": 1, "receiver": "q-probe.near"}], "cb": {"method": "on_read", "args": "", "static_ggas": 5000, "weight": 1}}', deposit = "" }
[[flow.static]]
child = "q-probe.near.burn"
actions = [[5000, 1]]
[[flow.static]]
child = "p-probe.near.on_read"
actions = [[5000, 1]]

[[flow]]
name = "chain3w"
about = "detached q.burn(1000) static 3000 w1; p.burn(2000) static 2000 w2, then p.on_read static 4000 w3: floor shares by weight (the remainder, a few gas, is below the model's Ggas resolution: examples/weight-split covers it)"
grid = "standard"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "chain", args = '{"kids": [{"method": "burn", "args": "{\"ggas\":1000}", "static_ggas": 3000, "weight": 1, "receiver": "q-probe.near"}, {"method": "burn", "args": "{\"ggas\":2000}", "static_ggas": 2000, "weight": 2}], "cb": {"method": "on_read", "args": "", "static_ggas": 4000, "weight": 3}, "detach": true}', deposit = "" }
[[flow.static]]
child = "q-probe.near.burn"
actions = [[3000, 1]]
[[flow.static]]
child = "p-probe.near.burn"
actions = [[2000, 2]]
[[flow.static]]
child = "p-probe.near.on_read"
actions = [[4000, 3]]

[[flow]]
name = "chain_w0"
about = "W = 0: q.burn(1000) static 4000 w0, then p.on_read static 3000 w0 (leftover not forwarded)"
grid = "standard"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "chain", args = '{"kids": [{"method": "burn", "args": "{\"ggas\":1000}", "static_ggas": 4000, "weight": 0, "receiver": "q-probe.near"}], "cb": {"method": "on_read", "args": "", "static_ggas": 3000, "weight": 0}}', deposit = "" }
[[flow.static]]
child = "q-probe.near.burn"
actions = [[4000, 0]]
[[flow.static]]
child = "p-probe.near.on_read"
actions = [[3000, 0]]

# nearcore rejects the zero-gas call: the parent fails after running, with
# no children, so its key is named here and calibrated from that failure.
[[flow]]
name = "chain_s0"
about = "q.burn(500) with static 0 and weight 0: a function call with no gas"
grid = "standard"
keys = { "chain" = "chain/burn,on_count" }
tx = { signer = "alice.near", receiver = "p-probe.near", method = "chain", args = '{"kids": [{"method": "burn", "args": "{\"ggas\":500}", "static_ggas": 0, "weight": 0, "receiver": "q-probe.near"}], "cb": {"method": "on_count", "args": "", "static_ggas": 3000, "weight": 1}}', deposit = "" }
[[flow.static]]
child = "q-probe.near.burn"
actions = [[0, 0]]
[[flow.static]]
child = "p-probe.near.on_count"
actions = [[3000, 1]]

