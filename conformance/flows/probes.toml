about = "y.yield_create(on_yield static 100 w1), then y.resume: the callback runs out of gas below its edge"
grid = "standard"
path = "oog"
path_for = ["y-probe.near.yield_create"]
tx = { signer = "alice.near", receiver = "y-probe.near", method = "yield_create", args = '{"cb_ggas": 100, "cb_weight": 1}', deposit = "" }
[[flow.static]]
child = "y-probe.near.on_yield"
actions = [[100, 1]]
[[flow.after]]
call = { signer = "alice.near", receiver = "y-probe.near", method = "resume", args = '{"bytes": 100}' }

[[flow]]
name = "yield_cb0"
about = "y.yield_create(on_yield with static 0 and weight 0): a yield callback with no gas fails the creator"
grid = "standard"
keys = { "yield_create" = "yield_create/cb0" }
tx = { signer = "alice.near", receiver = "y-probe.near", method = "yield_create", args = '{"cb_ggas": 0, "cb_weight": 0}', deposit = "" }
[[flow.static]]
child = "y-probe.near.on_yield"
actions = [[0, 0]]

[[flow]]
name = "relay_chain1"
about = "chain1 relayed by dave.near: alice's delegate for p.chain(q.burn(2000) static 5000 w1, then p.on_read static 5000 w1)"
grid = "standard"
relay = "dave.near"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "chain", args = '{"kids": [{"method": "burn", "args": "{\"ggas\":2000}", "static_ggas": 5000, "weight": 1, "receiver": "q-probe.near"}], "cb": {"method": "on_read", "args": "", "static_ggas": 5000, "weight": 1}}', deposit = "" }
[[flow.static]]
child = "q-probe.near.burn"
actions = [[5000, 1]]
[[flow.static]]
child = "p-probe.near.on_read"
actions = [[5000, 1]]
