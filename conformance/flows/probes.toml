# Probe flows: the conformance sweeps and the calibration of the
# standard-token burn keys (see README.md for the format).
#
# alice.near signs; p-probe.near and q-probe.near run the generic probe;
# ft-probe.near is a plain near-contract-standards FT; wnear-probe.near the
# wNEAR-like token; y-probe.near the async probe (yield/resume, an
# order-observing joint callback); dave.near is registered nowhere. Model
# names: p, q, ft_probe, wnear_probe, y. Gas in Ggas unless named tgas;
# deposits in yocto.
#
# Generated by scripts/gen_probes.py: edit that, not this file.

[world]
names = { "alice.near" = "alice", "dave.near" = "dave", "p-probe.near" = "p", "q-probe.near" = "q", "ft-probe.near" = "ft_probe", "wnear-probe.near" = "wnear_probe", "y-probe.near" = "y", "nobody.near" = "nobody", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" = "nimp", "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" = "nimp_new", "0x1111111111111111111111111111111111111111" = "eth", "0x2222222222222222222222222222222222222222" = "eth_new" }
# token batches: the key scheme of modules/Tokens.tla ("batch/" [D][S](T|C))
# (multi-call receipts; a one-call batch is keyed by its flow's `keys`)
keys = { "near_deposit+ft_transfer" = "batch/DT", "near_deposit+ft_transfer_call" = "batch/DC", "near_deposit+storage_deposit+ft_transfer" = "batch/DST", "near_deposit+storage_deposit+ft_transfer_call" = "batch/DSC", "storage_deposit+ft_transfer" = "batch/ST", "storage_deposit+ft_transfer_call" = "batch/SC", "near_deposit+storage_deposit" = "batch/DS" }

[[account]]
id = "alice.near"
near = 100000

[[account]]
id = "dave.near"
near = 1000

# existing NEAR-implicit and eth-implicit accounts (the *_new ids of the
# same shapes do not exist)
[[account]]
id = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
near = 10

[[account]]
id = "0x1111111111111111111111111111111111111111"
near = 10

[[contract]]
id = "p-probe.near"
