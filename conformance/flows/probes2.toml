# probe2 flows: the rule parts of the second generic probe that a flow can
# observe (the flow set probes2, scripts/flowsets.py; see README.md for the
# format). Its own flows file, so its sweeps (data/probes2) and table
# (tla/CalibProbes2.tla) are apart from flows/probes.toml's.
#
# alice.near signs; z-probe.near runs probe2; p-probe.near and q-probe.near
# the generic probe (p's chain, q's ret and fail as inputs); bob.near is a
# plain account. Model names: alice, bob, p, q, z. Gas in Ggas unless named
# tgas; deposits in yocto. Every account holds 1000 NEAR, as in the model.
#
# Generated by scripts/gen_probes2.py: edit that, not this file.

[world]
names = { "alice.near" = "alice", "bob.near" = "bob", "p-probe.near" = "p", "q-probe.near" = "q", "z-probe.near" = "z" }

[[account]]
id = "alice.near"
near = 1000

[[account]]
id = "bob.near"
near = 1000

[[contract]]
id = "p-probe.near"
wasm = "../probes/res/probe.wasm"
source = "conformance/probes/probe (near-sdk 5.29.1)"

[[contract]]
id = "q-probe.near"
wasm = "../probes/res/probe.wasm"
source = "conformance/probes/probe (near-sdk 5.29.1)"

[[contract]]
id = "z-probe.near"
wasm = "../probes/res/probe2.wasm"
source = "conformance/probes/probe2 (near-sdk 5.29.1)"

# probe2's paths, from its logs: a resume the host accepted or not; a yield
# callback that got a payload or timed out; a yield_id that met a pending
# custom id (in the same call or an earlier one) or not.
[[path_rule]]
call = "z-probe.near.resume"
log = "resume ok"
path = "ok"
else = "none"

[[path_rule]]
call = "z-probe.near.on_yield"
log = "timeout"
path = "timeout"
else = "payload"

[[path_rule]]
call = "z-probe.near.yield_id"
log = "yield duplicate"
path = "dup"
else = "new"

# Burn sizes: ret(bytes) by its argument, in KB (1000 bytes).
[[size]]
key = "q-probe.near.ret"
from = "arg:bytes"
div = 1000

[[flow]]
name = "refund_to_bob"
about = "z.refund_call(z.paid(fail) static 10000 w1 with 2 NEAR, refund_to bob.near): the deposit is refunded to bob.near"
grid = "standard"
path = "bob"
path_for = ["z-probe.near.refund_call", "z-probe.near.paid"]
tx = { signer = "alice.near", receiver = "z-probe.near", method = "refund_call", args = '{"c": {"method": "paid", "args": "{\"fail\": true}", "static_ggas": 10000, "weight": 1, "receiver": "z-probe.near", "deposit": "2000000000000000000000000"}, "refund_to": "bob.near"}', deposit = "" }
[[flow.static]]
child = "z-probe.near.paid"
actions = [[10000, 1]]

[[flow]]
name = "refund_to_none"
about = "z.refund_call(z.paid(fail) static 10000 w1 with 2 NEAR, refund_to unset): the deposit is refunded to z"
grid = "standard"
path = "none"
path_for = ["z-probe.near.refund_call", "z-probe.near.paid"]
tx = { signer = "alice.near", receiver = "z-probe.near", method = "refund_call", args = '{"c": {"method": "paid", "args": "{\"fail\": true}", "static_ggas": 10000, "weight": 1, "receiver": "z-probe.near", "deposit": "2000000000000000000000000"}}', deposit = "" }
[[flow.static]]
child = "z-probe.near.paid"
actions = [[10000, 1]]

