# Storage flows: the bytes a call adds to its receiver's storage_usage, for
# `calibrate --stor` (README.md, "Storage bytes"). Each flow runs at every
# point of the standard grid, and a key's bytes must be the same at every
# point where it succeeds; every key with a size source is measured at
# three sizes. Apart from probes.toml, whose sweeps are bound to that
# file's sha256; nothing is written to data/.
#
# alice.near signs; p-probe.near runs the generic probe (`put`: a
# key-value write); ft-probe.near is a plain near-contract-standards FT;
# wnear-probe.near the wNEAR-like token. dave.near (9 bytes),
# holder-with-a-longer-name.near (30) and
# holder-number-three-with-the-longest-name.near (46) are holders of
# three id lengths that also sign; the 64-byte NEAR-implicit id below is
# registered by storage_deposit only. Model names: p, ft_probe,
# wnear_probe. Deposits in yocto.

[world]
names = { "alice.near" = "alice", "dave.near" = "dave", "p-probe.near" = "p", "ft-probe.near" = "ft_probe", "wnear-probe.near" = "wnear_probe" }

[[account]]
id = "alice.near"
near = 100000

[[account]]
id = "dave.near"
near = 1000

[[account]]
id = "holder-with-a-longer-name.near"
near = 1000

[[account]]
id = "holder-number-three-with-the-longest-name.near"
near = 1000

[[contract]]
id = "p-probe.near"
wasm = "../probes/res/probe.wasm"
source = "conformance/probes/probe (near-sdk 5.29.1)"

[[contract]]
id = "ft-probe.near"
wasm = "../probes/res/ft.wasm"
source = "conformance/probes/ft (near-contract-standards 5.29.1)"
init = { method = "new", args = '{"owner_id": "alice.near", "total_supply": "1000000"}' }

[[contract]]
id = "wnear-probe.near"
wasm = "../probes/res/wrap.wasm"
source = "conformance/probes/wrap (near-contract-standards 5.29.1)"
init = { method = "new", args = '{}' }

# The probe's first mutating call also writes near-sdk's STATE record:
# warm it, so a flow's put adds only its own record.
[[setup]]
signer = "alice.near"
receiver = "p-probe.near"
method = "put"
args = '{"key": "warm", "value": ""}'

# The sizes: a put grows with its key + value, a registration with the
# holder's id (storage_deposit's account_id; near_deposit and
# storage_unregister act for the predecessor).
[[stor_size]]
key = "p-probe.near.put"
from = "arg_len:key+value"

[[stor_size]]
key = "ft-probe.near.storage_deposit"
from = "arg_len:account_id"

[[stor_size]]
key = "wnear-probe.near.storage_deposit"
from = "arg_len:account_id"

[[stor_size]]
key = "wnear-probe.near.near_deposit"
from = "predecessor_len"

[[stor_size]]
key = "ft-probe.near.storage_unregister"
from = "predecessor_len"

[[stor_size]]
key = "wnear-probe.near.storage_unregister"
from = "predecessor_len"


# ---- the probe's put: a new key adds key + value + 40 ----

[[flow]]
name = "put_new_0"
about = "put of a new key, empty value"
grid = "standard"
path = "new"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k1", "value": ""}' }

[[flow]]
name = "put_new_100"
about = "put of a new key, 100-byte value"
grid = "standard"
path = "new"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k1", "value": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"}' }

[[flow]]
name = "put_new_key20"
about = "put of a new 20-byte key, 22-byte value"
grid = "standard"
path = "new"
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "paid:holder-number-1", "value": "1000000000000000000000"}' }

# An overwrite with a value of the same length adds nothing.

[[flow]]
name = "put_same_5"
about = "put over an existing key, same length"
grid = "standard"
path = "same"
setup = [{ signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k1", "value": "abc"}' }]
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k1", "value": "xyz"}' }

[[flow]]
name = "put_same_52"
about = "put over an existing key, same length"
grid = "standard"
path = "same"
setup = [{ signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k2", "value": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' }]
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "k2", "value": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}' }

[[flow]]
name = "put_same_120"
about = "put over an existing key, same length"
grid = "standard"
path = "same"
setup = [{ signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "paid:holder-number-1", "value": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' }]
tx = { signer = "alice.near", receiver = "p-probe.near", method = "put", args = '{"key": "paid:holder-number-1", "value": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}' }

# ---- standard tokens: a registration is prefix + borsh(AccountId) + u128 + 40 ----

[[flow]]
name = "ft_storage_new_9"
about = "storage_deposit registers a 9-byte id"
grid = "standard"
path = "new"
path_for = ["ft-probe.near.storage_deposit"]
tx = { signer = "alice.near", receiver = "ft-probe.near", method = "storage_deposit", args = '{"account_id": "dave.near"}', deposit = "1250000000000000000000" }

