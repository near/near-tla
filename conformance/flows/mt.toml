# The flow set `mt` (scripts/flowsets.py): NEP-245 on the `mt` probe, a plain
# near-sdk-contract-tools 4.0.0 multi token, and the `mtrecv` receiver, whose
# mt_on_transfer answers as its msg says. The conformance sweeps and the
# calibration of the multi-token burn keys (see README.md for the format).
#
# alice.near holds 1000 of each of t1, t2, t3 and signs; dave.near is a plain
# account. Model names: alice, dave, mt, mr. Gas in Ggas unless named tgas;
# deposits in yocto.
#
# Generated by scripts/gen_mt.py: edit that, not this file.

[world]
names = { "alice.near" = "alice", "dave.near" = "dave", "mt-probe.near" = "mt", "mr-probe.near" = "mr" }

[[account]]
id = "alice.near"
near = 100000

[[account]]
id = "dave.near"
near = 1000

[[contract]]
id = "mt-probe.near"
wasm = "../probes/res/mt.wasm"
source = "conformance/probes/mt (near-sdk-contract-tools 4.0.0, near-sdk 5.29.1)"
init = { method = "new", args = '{"owner_id": "alice.near", "token_ids": ["t1", "t2", "t3"], "supply": "1000"}' }

[[contract]]
id = "mr-probe.near"
wasm = "../probes/res/mtrecv.wasm"
source = "conformance/probes/mtrecv (near-sdk 5.29.1)"

# near-sdk-contract-tools 4.0.0 (src/standard/nep245/mod.rs:264-287):
# mt_on_transfer gets static 0 and weight 10, mt_resolve_transfer static
# 5 Tgas (GAS_FOR_MT_RESOLVE_TRANSFER) and weight 1, for any number of ids.
[[static]]
child = "mr-probe.near.mt_on_transfer"
actions = [[0, 10]]

[[static]]
child = "mt-probe.near.mt_resolve_transfer"
actions = [[5000, 1]]

# Burns per id: the batch methods, the resolver and the receiver grow with
# the number of token ids.
[[size]]
key = "mt-probe.near.mt_batch_transfer"
from = "arg_count:token_ids"

[[size]]
key = "mt-probe.near.mt_batch_transfer_call"
from = "arg_count:token_ids"

[[size]]
key = "mt-probe.near.mt_resolve_transfer"
from = "arg_count:token_ids"

[[size]]
key = "mr-probe.near.mt_on_transfer"
from = "arg_count:token_ids"

[[flow]]
name = "mt_xfer"
about = "mt.mt_transfer(dave, t1, 1)"
grid = "standard"
tx = { signer = "alice.near", receiver = "mt-probe.near", method = "mt_transfer", args = '{"receiver_id": "dave.near", "token_id": "t1", "amount": "1"}', deposit = "1" }

[[flow]]
name = "mt_bxfer1"
about = "mt.mt_batch_transfer(dave, ['t1'], ['1'])"
grid = "standard"
tx = { signer = "alice.near", receiver = "mt-probe.near", method = "mt_batch_transfer", args = '{"receiver_id": "dave.near", "token_ids": ["t1"], "amounts": ["1"]}', deposit = "1" }

[[flow]]
name = "mt_bxfer2"
about = "mt.mt_batch_transfer(dave, ['t1', 't2'], ['1', '2'])"
grid = "standard"
tx = { signer = "alice.near", receiver = "mt-probe.near", method = "mt_batch_transfer", args = '{"receiver_id": "dave.near", "token_ids": ["t1", "t2"], "amounts": ["1", "2"]}', deposit = "1" }

[[flow]]
