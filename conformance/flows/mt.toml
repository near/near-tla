about = "mt.mt_transfer_call(mr, t1, 10, msg=keep)"
grid = "standard"
path = "keep"
path_for = ["mr-probe.near.mt_on_transfer"]
tx = { signer = "alice.near", receiver = "mt-probe.near", method = "mt_transfer_call", args = '{"receiver_id": "mr-probe.near", "token_id": "t1", "amount": "10", "msg": "keep"}', deposit = "1" }

[[flow]]
